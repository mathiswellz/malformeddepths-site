<style>
:root{--gold:#ffcd75;--blood:#e43b44;--ink:#05040a;--panel:#120e18;--edge:#3a2e4a;--text:#e8e0d0;--dim:#a098b0;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05040a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:VT323,monospace;color:var(--text);font-size:18px}
#game{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
#world{position:fixed;left:0;top:0;display:block;pointer-events:none;background:#05040a}
#lightl{position:fixed;left:0;top:0;display:block;pointer-events:none;transform-origin:0 0;mix-blend-mode:multiply;image-rendering:auto;will-change:transform}
#shade{position:fixed;left:0;top:0;display:none;pointer-events:none;image-rendering:auto}
#shade.lite{display:block;mix-blend-mode:multiply}
#shade.full{display:block}
#wxhaze{position:fixed;inset:0;pointer-events:none;opacity:0;visibility:hidden}
#lowhp{position:fixed;inset:0;pointer-events:none;background:rgb(160,10,20);opacity:0;visibility:hidden}
#lowhp.on{visibility:visible;animation:lowhp 1.05s ease-in-out infinite alternate}
@keyframes lowhp{from{opacity:.03}to{opacity:.17}}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
.hide{display:none!important}
.gothic{font-family:"Pirata One",serif;letter-spacing:.04em}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
#topbar{position:absolute;left:0;right:0;top:0;padding:calc(8px + var(--st)) calc(10px + var(--sr)) 0 calc(10px + var(--sl));display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
#areainfo{text-shadow:2px 2px 0 #000;line-height:1.05;min-width:0}
#areainfo .n{font-family:"Pirata One",serif;font-size:22px;color:var(--gold)}
#areainfo .q{font-size:15px;color:#cfc4e0;margin-top:2px;max-width:52vw;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#areainfo .lv{font-size:15px;color:var(--dim)}
#wxclock{display:block;width:182px;height:40px;margin-top:4px;pointer-events:auto;cursor:help}
#btns{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;pointer-events:auto;max-width:46vw}
.hb{width:38px;height:38px;border:2px solid var(--edge);background:rgba(18,14,24,.85);border-radius:6px;display:flex;align-items:center;justify-content:center;position:relative;padding:0;box-shadow:0 2px 0 #000}
.hb img{width:26px;height:26px;image-rendering:pixelated}
.hb .dot{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid #000;display:none}
.hb.alert .dot{display:block}
#minimap{position:absolute;right:calc(8px + var(--sr));top:calc(96px + var(--st));width:128px;height:96px;image-rendering:pixelated;opacity:.92;pointer-events:auto;cursor:pointer}
#bossbar{position:absolute;left:50%;transform:translateX(-50%);top:calc(200px + var(--st));width:min(420px,78vw);text-align:center;text-shadow:2px 2px 0 #000}
#bossbar .nm{font-family:"Pirata One",serif;font-size:20px;color:#ffb0b0}
#bossbar .bar{height:12px;border:2px solid #000;background:#2a0a10;box-shadow:0 0 0 2px #5a2030;margin-top:2px}
#bossbar .bar i{display:block;height:100%;background:linear-gradient(#ff5a5a,#a01020);transition:width .15s}
#bossbar .ln{font-size:15px;color:#ffb0b0;margin-top:4px;line-height:1.1;transition:opacity .8s;text-shadow:1px 1px 0 #000}
#toasts{position:absolute;left:0;right:0;bottom:calc(252px + var(--sb));display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none}
@media (pointer:fine){#toasts{bottom:calc(140px + var(--sb))}}
.toast{background:rgba(8,6,12,.72);border:1px solid var(--edge);padding:2px 8px;font-size:16px;line-height:1.1;max-width:78vw;text-align:center;animation:tin .25s ease-out;text-shadow:1px 1px 0 #000}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}
#banner{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;transition:opacity .6s}
#banner .t{font-family:"Pirata One",serif;font-size:clamp(34px,9vw,64px);color:var(--gold);text-shadow:3px 3px 0 #000,0 0 20px rgba(228,59,68,.5)}
#banner .s{font-size:20px;color:#cfc4e0;text-shadow:2px 2px 0 #000}
#bottom{position:absolute;left:0;right:0;bottom:0;padding:0 calc(6px + var(--sr)) calc(6px + var(--sb)) calc(6px + var(--sl));display:flex;flex-direction:column;align-items:center}
/* the experience bar: hammered gold in a dark iron channel (code-drawn: gradients, a fine diagonal grain, a bright top edge) */
#xp{width:min(460px,80vw);height:8px;background:linear-gradient(#0c0805,#1c130a);border:1px solid #000;border-radius:4px;box-shadow:0 0 0 1px #5a4122,inset 0 1px 2px rgba(0,0,0,.9);margin-bottom:5px;overflow:hidden}
#xp i{display:block;height:100%;width:0;border-radius:3px 2px 2px 3px;
  background:repeating-linear-gradient(115deg,rgba(255,250,220,.22) 0 1px,rgba(0,0,0,0) 1px 3px,rgba(90,50,10,.18) 3px 4px,rgba(0,0,0,0) 4px 6px),
    linear-gradient(#fff2bf 0%,#ffd468 28%,#e7a83c 58%,#a8691e 85%,#6e4212 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,240,.7),inset 0 -1px 0 rgba(70,38,8,.7),inset -1px 0 0 rgba(255,236,170,.9)}
#belt{display:flex;align-items:flex-end;gap:4px;pointer-events:auto}
.flask{position:relative;width:clamp(50px,14.4vw,64px);aspect-ratio:64/82}
.flask canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.flask .c{position:absolute;bottom:0;right:-2px;background:#000;border:1px solid var(--edge);font-size:15px;padding:0 4px;line-height:1.1}
.flask .v{position:absolute;left:0;right:0;top:47%;text-align:center;font-size:15px;text-shadow:1px 1px 0 #000,-1px -1px 0 #000}
.flask.poison .v{color:#c8ff9a}
.flask.poison canvas{filter:drop-shadow(0 0 6px rgba(120,230,70,.55))}
#skills{display:flex;gap:4px;padding:5px;background:rgba(10,8,14,.85);border:2px solid var(--edge);border-radius:6px;margin-bottom:4px;box-shadow:0 3px 0 #000}
.sk{width:clamp(40px,11.2vw,52px);height:clamp(40px,11.2vw,52px);position:relative;border:2px solid #000;background:#14121c;padding:0;overflow:hidden;box-shadow:inset 0 0 0 1px #4a3e5a}
.sk img{width:100%;height:100%;image-rendering:pixelated;display:block}
.sk .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.72)}
.sk .ct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;text-shadow:1px 1px 0 #000}
.sk .key{position:absolute;left:2px;top:0;font-size:13px;color:#c8c0d8;text-shadow:1px 1px 0 #000}
.sk .mn{position:absolute;right:2px;bottom:0;font-size:13px;color:#8ab0ff;text-shadow:1px 1px 0 #000}
.sk.locked img{filter:grayscale(1) brightness(.35)}
.sk.locked::after{content:"🔒";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;opacity:.7}
.sk.nomana img{filter:saturate(.3) brightness(.6)}
.sk.ult{border-color:#c08a3e;box-shadow:inset 0 0 0 1px #ffcd75}
.sk.ult.ready{animation:ultglow 1.6s ease-in-out infinite}
@keyframes ultglow{50%{box-shadow:inset 0 0 0 1px #ffcd75,0 0 14px rgba(255,205,117,.9)}}
.sk.ultlocked img{filter:grayscale(1) brightness(.35)}
.sk .lk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:#ffcd75;text-shadow:1px 1px 0 #000}
.sk.empty{border:2px dashed #5a4870;background:rgba(20,18,28,.55);box-shadow:none}
.sk .plus,.lslot .plus{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;color:#6a5a80;line-height:1}
/* skill tree: the five slots and the slot pickers */
.loadout{position:sticky;top:0;z-index:3;border:2px solid var(--edge);background:#0b0810;padding:7px 8px 8px;border-radius:4px;margin-bottom:10px;box-shadow:0 8px 10px -6px #000}
.lrow{display:flex;gap:6px;justify-content:center}
.lslot{position:relative;width:58px;height:58px;padding:0;border:2px solid #000;background:#14121c;box-shadow:inset 0 0 0 1px #4a3e5a;border-radius:3px;-webkit-touch-callout:none}
.lslot img{width:100%;height:100%;display:block;image-rendering:pixelated;pointer-events:none}
.lslot.empty{border:2px dashed #5a4870;background:rgba(20,18,28,.55);box-shadow:none}
.lslot.ult{border-color:#c08a3e;box-shadow:inset 0 0 0 1px #ffcd75}
.lslot.arm{outline:2px solid var(--gold);box-shadow:0 0 12px rgba(255,205,117,.6)}
.lslot .key{position:absolute;left:3px;top:0;font-size:14px;color:#c8c0d8;text-shadow:1px 1px 0 #000}
.lslot .lx{position:absolute;right:2px;top:-1px;font-size:13px;color:#ff9a9a;text-shadow:1px 1px 0 #000;opacity:.8}
.slotpick{display:flex;gap:4px;align-items:center;margin-top:5px;flex-wrap:wrap}
.slotpick .sub{font-size:16px;margin-right:2px}
.sp{min-width:34px;height:30px;padding:0 6px;border:2px solid #5a4870;background:linear-gradient(#2a2032,#1a1220);color:var(--text);font-size:17px;border-radius:3px;box-shadow:0 2px 0 #000}
.sp.on{border-color:#c08a3e;color:#1a1008;background:linear-gradient(#ffd98a,#d89a3a)}
.skn img.dragsk{cursor:grab;-webkit-touch-callout:none;touch-action:none}
/* bag: sort bar and drag and drop */
.sortbar{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.sortbar .sub{font-size:16px;margin-right:2px}
.sortbar .btn.sm{font-size:16px;padding:3px 8px}
.cell,.cell img{-webkit-touch-callout:none;-webkit-user-drag:none}
.cell img{pointer-events:none}
[data-drag]{cursor:grab}
.dndsrc{opacity:.35}
.dndarm{outline:2px solid var(--gold);outline-offset:1px;box-shadow:0 0 12px rgba(255,205,117,.7);transform:scale(1.06);transition:transform .08s}
.dndok{box-shadow:0 0 0 2px rgba(255,205,117,.55),0 0 10px rgba(255,205,117,.35)}
.dndno{box-shadow:0 0 0 2px rgba(228,59,68,.7),0 0 10px rgba(228,59,68,.45)}
.dndhov{outline:2px solid #fff;box-shadow:0 0 0 2px var(--gold),0 0 14px rgba(255,205,117,.7)}
.eqgrid.dndhov,.grid.dndhov,[data-drop=sklist].dndhov{outline:2px dashed rgba(255,205,117,.6);outline-offset:3px;box-shadow:none}
#dndghost{position:fixed;z-index:100;width:56px;height:56px;margin:-28px 0 0 -28px;pointer-events:none;display:none;filter:drop-shadow(0 4px 6px #000);transition:opacity .1s}
#dndghost.touch{margin:-78px 0 0 -28px}
#dndghost.no{opacity:.55}
#dndghost img{width:100%;height:100%;image-rendering:pixelated;-webkit-touch-callout:none}
/* touch controls */
#touch{position:absolute;inset:0}
#atk{position:absolute;right:calc(14px + var(--sr));bottom:calc(150px + var(--sb));width:86px;height:86px;border-radius:50%;border:3px solid rgba(255,205,117,.6);background:radial-gradient(circle at 40% 35%,rgba(120,40,50,.75),rgba(30,8,14,.85));pointer-events:auto;display:flex;align-items:center;justify-content:center}
#atk img{width:52px;height:52px;image-rendering:pixelated}
#dodgeb{position:absolute;right:calc(110px + var(--sr));bottom:calc(112px + var(--sb));width:62px;height:62px;border-radius:50%;border:2px solid rgba(125,249,255,.55);background:radial-gradient(circle at 40% 35%,rgba(36,52,84,.8),rgba(10,10,22,.9));pointer-events:auto;color:#d8f4ff;font-size:19px;padding:0;overflow:hidden}
#dodgeb::after{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.6) calc(var(--cd,0)*360deg),transparent 0);pointer-events:none}
#dodgeb.cd{color:#8aa0b0}
/* phone: a health and a mana potion of their own, above the skills on the right (placed by layoutTouch) */
.potb{position:absolute;width:54px;height:54px;border-radius:50%;border:2px solid rgba(255,205,117,.5);background:radial-gradient(circle at 40% 35%,rgba(44,34,58,.88),rgba(10,8,16,.92));pointer-events:auto;touch-action:none;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #000,inset 0 0 0 1px #4a3e5a}
#potH{border-color:rgba(228,59,68,.7)} #potM{border-color:rgba(74,140,255,.7)}
.potb img{width:40px;height:40px;image-rendering:auto;pointer-events:none}
.potb b{position:absolute;right:-4px;bottom:-4px;min-width:20px;font-size:15px;font-weight:normal;line-height:18px;padding:0 3px;text-align:center;color:#fff;background:#0b0810;border:1px solid var(--edge);border-radius:9px;pointer-events:none}
.potb::after{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(0,0,0,.62) calc(var(--cd,0)*360deg),transparent 0);pointer-events:none}
.potb.none img{filter:grayscale(1) brightness(.55)} .potb.none b{color:#8a8098}
.potb.poison{border-color:#7fe04a;box-shadow:0 2px 0 #000,0 0 10px rgba(120,230,70,.5)}
@media (pointer:fine){.potb{display:none}}
#oilb{position:absolute;right:calc(34px + var(--sr));bottom:calc(98px + var(--sb));width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,205,117,.55);background:rgba(18,14,24,.88);pointer-events:auto;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #000}
#oilb img{width:32px;height:32px;image-rendering:pixelated}
#oilb.dim img{filter:saturate(.5) brightness(.75)}
#oilb .t{position:absolute;bottom:2px;right:calc(100% + 3px);font-size:14px;background:#000;border:1px solid var(--edge);padding:0 4px;line-height:1.15;white-space:nowrap}
#oilb .k{display:none;position:absolute;left:3px;top:0;font-size:12px;color:#c8c0d8;text-shadow:1px 1px 0 #000}
@media (pointer:fine){#oilb{right:calc(22px + var(--sr));bottom:calc(26px + var(--sb))} #oilb .k{display:block}}
#act{position:absolute;right:calc(110px + var(--sr));bottom:calc(178px + var(--sb));min-width:84px;height:44px;padding:0 10px;border-radius:22px;border:2px solid var(--gold);background:rgba(18,14,24,.9);color:var(--gold);font-size:20px;pointer-events:auto}
#joy{position:absolute;width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);pointer-events:none;transform:translate(-50%,-50%)}
#joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.35)}
#mapover{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.kbl{display:flex;flex-direction:column;gap:4px}
.kbr{display:grid;grid-template-columns:1fr 112px 112px;gap:6px;align-items:center}
.kbr .kb{min-width:0;width:100%}
.kbr .kb.wait{border-color:var(--gold);color:var(--gold);animation:ultglow 1.2s ease-in-out infinite}
.togs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#buffs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;max-width:min(420px,60vw);pointer-events:auto}
#buffs:empty{display:none}
#buffs .bf{position:relative;width:36px;height:36px;border:2px solid #888;border-radius:6px;overflow:hidden;background:#0b0810;box-shadow:0 2px 0 #000;cursor:help}
#buffs .bf.bad{box-shadow:0 0 0 1px #000,0 0 8px rgba(228,59,68,.55)}
#buffs .bf img{width:100%;height:100%;display:block;image-rendering:auto}
#buffs .bf i{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.66) calc(var(--p,0)*360deg),transparent 0)}
#buffs .bf b{position:absolute;right:2px;bottom:0;font-size:15px;font-weight:normal;line-height:1;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
#bossfx{display:flex;justify-content:center;gap:4px;margin-top:4px;pointer-events:auto}
#bossfx:empty{display:none}
#bossfx .bf{position:relative;width:30px;height:30px;border:2px solid #888;border-radius:5px;overflow:hidden;background:#0b0810;box-shadow:0 2px 0 #000;cursor:help}
#bossfx .bf img{width:100%;height:100%;display:block}
#bossfx .bf i{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.66) calc(var(--p,0)*360deg),transparent 0)}
#bossfx .bf b{position:absolute;right:2px;bottom:0;font-size:14px;font-weight:normal;line-height:1;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;width:min(880px,94vw)}
.gi{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:0 0 8px;background:#120e18;border:2px solid var(--edge);border-radius:6px;overflow:hidden;color:var(--fg,#e8e2ec);font:inherit;text-align:left;cursor:pointer;box-shadow:0 3px 0 #000}
.gi img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;margin-bottom:4px;filter:brightness(.85)}
.gi:hover img,.gi:focus img{filter:none}
.gi .gt{font-size:21px;color:var(--gold);padding:0 10px}
.gi .gs{font-size:15px;opacity:.75;padding:0 10px}
.gi .gp{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.7);border:1px solid var(--gold);color:var(--gold);font-size:15px;padding:1px 7px;border-radius:3px}
.gi.locked{cursor:default;opacity:.65}
.gi.locked .gl{width:100%;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;font-size:34px;background:repeating-linear-gradient(45deg,#16111c 0 10px,#1b1522 10px 20px);margin-bottom:4px}
.gi.locked .gt{color:#9a90a8}
.togs .tog{text-align:left;opacity:.6}
.togs .tog.on{opacity:1;border-color:var(--gold)}
#joyhint{position:absolute;left:calc(26px + var(--sl));bottom:calc(150px + var(--sb));font-size:16px;color:rgba(255,255,255,.35);pointer-events:none}
/* phone controls: skills in an arc around a bigger attack button (layoutTouch() places them) */
body.touchui #atk{right:calc(14px + var(--sr));bottom:calc(18px + var(--sb));width:96px;height:96px}
body.touchui #atk img{width:58px;height:58px}
body.touchui #skills{position:fixed;inset:0;display:block;padding:0;margin:0;border:0;background:none;box-shadow:none;pointer-events:none}
body.touchui #skills .sk{position:absolute;width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,205,117,.5);box-shadow:0 2px 0 #000,inset 0 0 0 1px #4a3e5a;pointer-events:auto;touch-action:none}
body.touchui #skills .sk.empty{border:2px dashed #6a5880;background:rgba(20,18,28,.6);box-shadow:none}
body.touchui #skills .sk.ult{border-color:#e0a84e}
body.touchui #skills .sk .key{display:none}
body.touchui #skills .sk .mn{right:0;left:0;bottom:2px;text-align:center;font-size:12px}
body.touchui #skills .sk .plus{font-size:24px}
/* in Palli the attack and skill buttons stay where they are, dimmed: they can't be used there */
body.intown #atk,body.intown #skills .sk:not(.empty){filter:grayscale(.8) brightness(.62)}
/* Interface size (Settings) on phones: every control and the HUD at --uis times its size (layoutTouch spaces them to match) */
body.touchui #atk{width:calc(96px*var(--uis,1));height:calc(96px*var(--uis,1))}
body.touchui #atk img{width:calc(58px*var(--uis,1));height:calc(58px*var(--uis,1))}
body.touchui #skills .sk{width:calc(52px*var(--uis,1));height:calc(52px*var(--uis,1))}
body.touchui #skills .sk .mn{font-size:calc(12px*var(--uis,1))}
body.touchui #skills .sk .ct{font-size:calc(22px*var(--uis,1))}
body.touchui #skills .sk .plus{font-size:calc(24px*var(--uis,1))}
body.touchui #dodgeb{width:calc(62px*var(--uis,1));height:calc(62px*var(--uis,1));font-size:calc(19px*var(--uis,1))}
body.touchui .potb{width:calc(54px*var(--uis,1));height:calc(54px*var(--uis,1))}
body.touchui .potb img{width:calc(40px*var(--uis,1));height:calc(40px*var(--uis,1))}
body.touchui .potb b{font-size:calc(15px*var(--uis,1));line-height:calc(18px*var(--uis,1));min-width:calc(20px*var(--uis,1))}
body.touchui #oilb{width:calc(46px*var(--uis,1));height:calc(46px*var(--uis,1))}
body.touchui #oilb img{width:calc(32px*var(--uis,1));height:calc(32px*var(--uis,1))}
body.touchui #oilb .t{font-size:calc(14px*var(--uis,1))}
body.touchui #act{height:calc(44px*var(--uis,1));min-width:calc(84px*var(--uis,1));font-size:calc(20px*var(--uis,1));border-radius:calc(22px*var(--uis,1))}
body.touchui #joy{width:calc(120px*var(--uis,1));height:calc(120px*var(--uis,1))}
body.touchui #joy i{width:calc(50px*var(--uis,1));height:calc(50px*var(--uis,1));margin:calc(-25px*var(--uis,1)) 0 0 calc(-25px*var(--uis,1))}
body.touchui .flask{width:calc(clamp(50px,14.4vw,64px)*var(--uis,1))}
body.touchui .flask .v,body.touchui .flask .c{font-size:calc(15px*var(--uis,1))}
body.touchui #areainfo{transform:scale(var(--uis,1));transform-origin:0 0}
body.touchui #areainfo .q{max-width:calc(52vw/var(--uis,1))}
body.touchui #btns{transform:scale(var(--uis,1));transform-origin:100% 0;max-width:calc(46vw/var(--uis,1))}
body.touchui #minimap{transform:scale(var(--uis,1));transform-origin:100% 0}
body.touchui #belt{gap:6px}
body.touchui #xp{width:calc(min(300px,34vw)*var(--uis,1))}
body.touchui.upright #bottom,body.touchui.beltleft #bottom{align-items:flex-start}
body.touchui.upright #xp{width:calc(min(140px,32vw)*var(--uis,1))}
/* ---------- panels ---------- */
.modal{position:fixed;inset:0;background:rgba(3,2,6,.7);display:flex;align-items:center;justify-content:center;pointer-events:auto;padding:calc(8px + var(--st)) 8px calc(8px + var(--sb))}
.panel{background:linear-gradient(#17121e,#0e0a12);border:2px solid var(--edge);box-shadow:0 0 0 2px #000,0 10px 40px #000;width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;border-radius:6px}
.ph{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:2px solid var(--edge);background:#1d1626}
.ph h2{margin:0;font-family:"Pirata One",serif;font-weight:normal;font-size:28px;color:var(--gold)}
.x{background:none;border:2px solid var(--edge);width:36px;height:36px;font-size:22px;border-radius:4px;color:var(--dim)}
.pb{padding:10px 12px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
.duo{display:flex;gap:12px;align-items:stretch;justify-content:center;width:100%;height:100%;min-height:0}   /* couch co-op: both heroes' pages */
.duo .side{flex:1 1 0;min-width:0;display:flex;justify-content:center;align-items:center;max-height:100%}
.duo .panel{width:100%;max-width:560px}
.duo .side[data-hero="0"] .panel{border-color:rgba(255,205,117,.55)}
.duo .side[data-hero="1"] .panel{border-color:rgba(125,249,255,.55)}
.duoh{font-size:14px;margin:0 8px;white-space:nowrap}
.sidewin{width:330px;max-height:100%;overflow-y:auto;flex:none;align-self:center;margin-right:12px;padding:10px 12px;background:linear-gradient(#17121e,#0e0a12);border:2px solid var(--edge);box-shadow:0 0 0 2px #000,0 10px 40px #000;border-radius:6px}
.pf{border-top:2px solid var(--edge);padding:6px 12px 10px;max-height:44vh;overflow-y:auto;background:#120e18;flex:none;border-radius:0 0 6px 6px}
.pf .card{margin-top:0}
.btn.sm{font-size:17px;padding:5px 10px}
.dlg .btn{font-size:18px;padding:6px 10px}
#dlgopts.many{flex-direction:column;align-items:stretch;gap:5px}
#dlgopts.many .btn{text-align:left}
#dlgopts{gap:6px}
.btn{background:linear-gradient(#3a2a40,#24182a);border:2px solid #5a4870;padding:8px 14px;border-radius:4px;font-size:20px;color:var(--text);box-shadow:0 2px 0 #000}
.btn:active{transform:translateY(1px)}
.btn.gold{border-color:#c08a3e;color:var(--gold)}
.btn.red{border-color:#8f3b55;color:#ffb0b0}
.btn[disabled]{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.panel.wide{width:min(980px,100%);flex:0 1 auto;min-width:0}
.stashduo{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media (max-width:640px){.stashduo{gap:8px}.stashduo .grid{grid-template-columns:repeat(4,1fr);gap:3px}.stashduo.money{grid-template-columns:1fr}}
.cell{aspect-ratio:1;background:#0b0810;border:2px solid #2a2234;position:relative;display:flex;align-items:center;justify-content:center;padding:0;border-radius:3px}
.cell img{width:80%;height:80%;image-rendering:pixelated}
.cell.sel{outline:2px solid #fff}
.cell .lbl{position:absolute;bottom:0;left:0;right:0;font-size:12px;color:#6a6080;text-align:center;line-height:1}
.cell .brk{position:absolute;top:1px;right:3px;color:var(--blood);font-size:14px}
.cell .pl{position:absolute;top:0;left:3px;font-size:14px;color:var(--gold);text-shadow:1px 1px 0 #000,-1px 0 0 #000}
.eqgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}
.card{border:2px solid var(--edge);background:#0b0810;padding:8px 10px;margin-top:8px;border-radius:4px;line-height:1.15}
.card .nm{font-size:22px}
.card .sub{color:var(--dim);font-size:16px}
.card .af{color:#8ab0ff}
.card .bad{color:#ff7a7a}.card .good{color:#a7f070}
.stat{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #241c2e;font-size:20px}
.stat .pl{width:34px;height:34px;padding:0;font-size:22px}
.skn{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--edge);background:#0b0810;padding:8px;border-radius:4px;position:relative}
.skn img{width:54px;height:54px;image-rendering:pixelated;flex:none}
.skn.lock{opacity:.55}

<script>
const DEMO_BUILD = true;
const DEMO = typeof DEMO_BUILD !== 'undefined';   // set by build.py --demo
const DEMO_TEXT = `You have reached the end of the free demo.\n\nBelow the Weeping Rift lie nine more depths, the sealed chambers, Khala, Asura, Vessa, and Ilvaroth himself.\n\nThank you for playing. The full game is coming from Wellz Digitalez.`;
// ============ STORE: where heroes are saved ============
// The phone build runs as a claude.ai artifact: there the saves live in the artifact's database, in the player's own
// private corner (data/users/<id>/), so they survive closing the app. Everywhere else (the PC build, a local file) they
// live in localStorage. The game reads synchronously from STORE.cache, filled from both at start-up (the newer save wins);
// every write goes to localStorage at once and to the database a moment later, one write at a time per save.
// graphics level: 2 Sharp, 1 Balanced, 0 Battery saver (phones start on Balanced). render.js resize() reads it, so it must exist before render.js runs
const SH_URL = (() => { try{ const v = new URLSearchParams(location.search).get('shade'); return v == null || v === '' ? null : Math.max(0, Math.min(2, +v || 0)); }catch(e){ return null; } })();   // ?shade=0..2 forces a lighting level (tests)
const GFX = {q:matchMedia('(pointer:coarse)').matches ? 1 : 2, low:false, minFrame:0, uis:1, sh:SH_URL != null ? SH_URL : matchMedia('(pointer:coarse)').matches ? 1 : 2};   // uis: the interface size from Settings (1 = 100%)
const STORE = {cache:{}, ready:false, cloud:false, col:null, last:{}, dirty:{}, busy:{}, timer:{}, failed:false, note:''};
function stLocal(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function stGet(k){ return Object.prototype.hasOwnProperty.call(STORE.cache, k) ? STORE.cache[k] : stLocal(k); }
function stSet(k, v){ STORE.cache[k] = v; try{ localStorage.setItem(k, v); }catch(e){} stQueue(k); }
function stDel(k){ STORE.cache[k] = null; try{ localStorage.removeItem(k); }catch(e){} stQueue(k); }
function stDocId(k){ return k.replace(/^malformed_depths_/, '').replace(/[^A-Za-z0-9_\-]/g, '_'); }   // slot_0 … slot_4, stash, md_settings
function stKeys(){ const a = []; for(let s = 0; s < HERO_SLOTS; s++) a.push(saveKey(s)); a.push(STASH_KEY, 'md_settings'); return a; }
function stQueue(k, now){
  if(!STORE.cloud) return;
  clearTimeout(STORE.timer[k]); STORE.dirty[k] = true;
  STORE.timer[k] = setTimeout(() => stWrite(k), now ? 0 : 900);   // a burst of saves becomes one write
}
async function stWrite(k){
  if(STORE.busy[k] || !STORE.dirty[k]) return;
  STORE.busy[k] = true;
  try{
    while(STORE.dirty[k]){
      STORE.dirty[k] = false; const v = STORE.cache[k];
      if(v === STORE.last[k]) continue;                          // only on change
      const ref = STORE.col.doc(stDocId(k));
      let tries = 0;
      for(;;){
        try{ if(v == null) await ref.delete(); else await ref.set({v, t:Date.now()}); STORE.last[k] = v; break; }
        catch(e){ const c = e && e.code;
          if((c === 'unavailable' || !c) && tries++ < 2){ await new Promise(r => setTimeout(r, 600 + Math.random()*900)); continue; }
          stFail(c); return; }
      }
    }
  } finally { STORE.busy[k] = false; }
}
function stFlush(){ if(STORE.cloud) for(const k in STORE.timer){ if(STORE.dirty[k]){ clearTimeout(STORE.timer[k]); stWrite(k); } } }
addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') stFlush(); });
addEventListener('pagehide', stFlush);
function stFail(code){
  if(STORE.failed) return; STORE.failed = true;
  const msg = code === 'quota_exceeded' ? 'Cloud saves are full. Your progress is still kept on this phone.' : 'Could not reach cloud saves. Your progress is still kept on this phone for now.';
  try{ toast(msg, '#ff8a8a', 6); }catch(e){}
}
function stSavedAt(v){ try{ return JSON.parse(v).time || 0; }catch(e){ return 0; } }
async function stInit(){
  let db = null, id = null;
  // in the claude.ai viewer the page is served over https and window.claude appears around load; give it a moment
  if(location.protocol !== 'file:') for(let i = 0; i < 30 && !(window.claude && typeof window.claude.use === 'function'); i++) await new Promise(r => setTimeout(r, 100));
  try{
    if(window.claude && typeof window.claude.use === 'function'){
      const to = new Promise(r => setTimeout(() => r(null), 10000));
      db = await Promise.race([window.claude.use('db'), to]);
      const user = db && await Promise.race([window.claude.use('user'), to]);
      id = user && await user.id();
    }
  }catch(e){ db = null; }
  if(db && id){
    try{
      STORE.col = db.collection('data/users/' + id);
      const keys = stKeys(), got = await Promise.race([Promise.all(keys.map(k => STORE.col.doc(stDocId(k)).get())), new Promise(r => setTimeout(() => r(null), 10000))]);
      if(got){
        STORE.cloud = true;
        keys.forEach((k, i) => {
          const snap = got[i], cloudV = snap && snap.exists ? (snap.data() || {}).v : undefined, localV = stLocal(k);
          let use = cloudV !== undefined ? cloudV : localV;
          if(cloudV !== undefined && localV != null && /slot/.test(k) && stSavedAt(localV) > stSavedAt(cloudV)) use = localV;   // this phone has a newer save than the cloud
          if(cloudV !== undefined) STORE.last[k] = cloudV;
          if(use != null){ STORE.cache[k] = use; try{ localStorage.setItem(k, use); }catch(e){} if(use !== cloudV) stQueue(k, true); }
        });
      } else STORE.note = 'Cloud saves are not answering, so this visit saves on this phone only.';
    }catch(e){ STORE.cloud = false; STORE.note = 'Cloud saves are not available here, so this visit saves on this phone only.'; }
  } else if(window.claude) STORE.note = 'Sign in to keep your heroes in the cloud. For now they save on this phone only.';
  STORE.ready = true;
  stReady();
}
function stReady(){
  try{ loadSettings(); setVolumes(AU.musicVol, AU.sfxVol); }catch(e){}
  if(G.state === 'menu' && document.getElementById('stLoading')) showMainMenu();
}
setTimeout(stInit, 0);

function mkCanvas(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function buildSprite(rows, over, mode){

  const pad = mode && mode.outline ? 1 : 0;
  const c = mkCanvas(w + pad*2, h + pad*2), x = c.getContext('2d');
  const col = ch => (over && over[ch]) || PAL[ch];
  if(pad){
    x.fillStyle = mode.outline;
    rows.forEach((row, j) => [...row].forEach((ch, i) => { if(col(ch)){ x.fillRect(i, j, 3, 3); } }));
  }
  rows.forEach((row, j) => [...row].forEach((ch, i) => { const cc = col(ch); if(cc){ x.fillStyle = (mode === 'white') ? '#ffffff' : cc; x.fillRect(i + pad, j + pad, 1, 1); } }));

}

function getSprite(name, over, mode){

function sndGet(url, ok, fail){            // XHR, not fetch: with the PC launcher's flag it can read the game's own files
  try{
    const x = new XMLHttpRequest(); x.open('GET', url, true); x.responseType = 'arraybuffer';
    x.onload = () => (x.status === 200 || x.status === 0) && x.response && x.response.byteLength > 1024 ? ok(x.response) : fail();
    x.onerror = fail; x.send();
  }catch(e){ fail(); }
}
function sndDecode(ab, ok, fail){          // decoded at 32 kHz: a third less memory than 48 kHz, and plenty for game sounds
  if(SND.dec === undefined){ try{ const O = window.OfflineAudioContext || window.webkitOfflineAudioContext; SND.dec = O ? new O(1, 32000, 32000) : null; }catch(e){ SND.dec = null; } }
  const dec = (c, buf, onFail) => { try{ const p = c.decodeAudioData(buf, ok, onFail); if(p && p.catch) p.catch(() => {}); }catch(e){ onFail(); } };
  if(SND.dec){ const copy = ab.slice(0); dec(SND.dec, ab, () => dec(AU.ctx, copy, fail)); } else dec(AU.ctx, ab, fail);
}
function sndLoad(sheet, then){
  if(SND.off){ if(then) then(); return; }
  if(SND.st[sheet]){ if(then) then(); return; }
  SND.st[sheet] = 'loading';
  const done = good => { SND.st[sheet] = good ? 'ok' : 'bad'; if(then) then(); };
  sndGet('assets/sfx/md_sfx_' + sheet + '.mp3', ab => sndDecode(ab, b => { SND.buf[sheet] = b; done(true); }, () => done(false)), () => done(false));
}
function sndBoot(){                        // after the first tap: the room echo, then the sheets every game needs, one after another
  if(SND.booted || !AU.ctx) return; SND.booted = true;
  const c = AU.ctx, sr = c.sampleRate, n = Math.floor(sr*1.7), ir = c.createBuffer(2, n, sr);
  for(let ch = 0; ch < 2; ch++){ const d = ir.getChannelData(ch); let lp = 0;
    for(let i = 0; i < n; i++){ const t = i/sr; lp += ((Math.random()*2 - 1) - lp)*(0.55 - 0.3*t/1.7); d[i] = lp*Math.exp(-4.2*t)*(t < 0.012 ? t/0.012 : 1); } }   // a stone room: darker as it fades
  const cv = c.createConvolver(); cv.buffer = ir; SND.roomIn = c.createGain(); SND.roomIn.gain.value = 0.2; SND.roomIn.connect(cv); cv.connect(AU.sfxBus);
  const q = ['world', 'heroes', 'v3', 'monsters'];
  const next = last => { if(last && SND.st[last] === 'bad' && location.protocol === 'file:'){ SND.off = true; return; }   // files can't be read here: the synthesized sounds it is
    const s = q.shift(); if(s) sndLoad(s, () => next(s)); };
  next();
}
function sndHas(name){ const p = SND_MAN[name]; return !!(p && p.some(t => SND.buf[SND_SHEETS[t[0]]])); }
function sndEar(){ const h = party(); if(!h.length) return null; let x = 0, y = 0; for(const p of h){ x += p.x; y += p.y; } return {x:x/h.length, y:y/h.length}; }
// o: vol, rate, pv (random pitch spread), at (where it happens), delay, cut (fade out by then), room (echo), gap (ms before it can play again), max (voices)
function snd(name, o = {}){
  const pool = SND_MAN[name]; if(!pool || !AU.ctx || SND.off) return false;
  if(!SND.booted) sndBoot();
  const ready = []; for(let i = 0; i < pool.length; i++) if(SND.buf[SND_SHEETS[pool[i][0]]]) ready.push(i);
  if(!ready.length){ for(const t of pool) sndLoad(SND_SHEETS[t[0]]); return false; }
  const now = performance.now();
  if(now - (SND.last[name] || 0) < (o.gap ?? 40) || (SND.vo[name] || 0) >= (o.max || 4) || SND.nvo >= 32) return true;   // already sounding: no pile-ups
  SND.last[name] = now;
  let k = ready[Math.floor(Math.random()*ready.length)];
  if(ready.length > 1 && k === SND.prev[name]){ const j = ready.indexOf(k); k = ready[(j + 1 + Math.floor(Math.random()*(ready.length - 1))) % ready.length]; }
  SND.prev[name] = k;
  const [sh, st, du] = pool[k], c = AU.ctx;
  let vol = o.vol ?? 0.7, pan = 0;
  if(o.at && o.at.x != null){ const L = sndEar(); if(L){ const dx = o.at.x - L.x, d = Math.hypot(dx, o.at.y - L.y); vol *= Math.max(0.1, Math.min(1, 1 - (d - 90)/340)); pan = Math.max(-0.7, Math.min(0.7, dx/260)); } }
  const s = c.createBufferSource(); s.buffer = SND.buf[SND_SHEETS[sh]];
  const rate = (o.rate || 1)*(1 + (Math.random()*2 - 1)*(o.pv ?? 0.04)); s.playbackRate.value = rate;
  const t0 = c.currentTime + (o.delay || 0), len = Math.min(du/1000 + 0.03, o.cut || 99), g = c.createGain();
  if(o.soft){ g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(vol, t0 + o.soft); } else g.gain.value = vol;   // soft: fade in over that many seconds (takes the click off the attack)
  if(o.cut){ g.gain.setValueAtTime(vol, t0 + Math.max(0, o.cut - 0.3)/rate); g.gain.linearRampToValueAtTime(0.0001, t0 + o.cut/rate); }
  let src = s; if(o.lp){ const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = 0.6; s.connect(f); src = f; }   // lp: muffle above that pitch
  src.connect(g); let out = g;
  if(pan && c.createStereoPanner){ const p = c.createStereoPanner(); p.pan.value = pan; g.connect(p); out = p; }
  out.connect(AU.sfxBus);
  const wet = o.room ?? 1; if(wet > 0 && SND.roomIn){ if(wet === 1) out.connect(SND.roomIn); else { const w = c.createGain(); w.gain.value = wet; out.connect(w); w.connect(SND.roomIn); } }

// ---------- music ----------
function stopMusicNodes(){
  const c = AU.ctx; if(!c) return; const t = c.currentTime;
  AU.nodes.forEach(n => { try{ if(n.gain){ n.gain.cancelScheduledValues(t); n.gain.setTargetAtTime(0.0001, t, 0.8); } if(n.stop) n.stop(t + 4); }catch(e){} });
  AU.nodes = [];
  if(AU.timer){ clearInterval(AU.timer); AU.timer = null; }
}
function drone(freqs, type, cutoff, vol, lfoRate = 0.07){
  const c = AU.ctx, t = c.currentTime;

  AU.nodes.push(out, lfo);
  freqs.forEach(fr => [0, 7, -6].forEach(det => { const o = c.createOscillator(); o.type = type; o.frequency.value = fr; o.detune.value = det; o.connect(f); o.start(); AU.nodes.push(o); }));
}
function bell(freq, vol = 0.06, dur = 5){
  const c = AU.ctx, t = c.currentTime;
  [[1, 1], [2.76, 0.4], [5.4, 0.15]].forEach(([m, v]) => {
    const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = freq*m;
    env(g, t, 0.01, vol*v, dur/m); o.connect(g); g.connect(AU.rev); g.connect(AU.musicBus); o.start(t); o.stop(t + dur + 0.2);
  });
}
function pad(freqs, vol = 0.04, dur = 6){
  const c = AU.ctx, t = c.currentTime;
  const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700; const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur*0.4); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  f.connect(g); g.connect(AU.musicBus); g.connect(AU.rev);

function thump(vol = 0.25, when = 0){

const SCALE = [0, 1, 3, 5, 7, 8, 11]; // harmonic phrygian-ish, very dark
function scaleNote(root, deg){ const o = Math.floor(deg/7); return root + SCALE[((deg % 7) + 7) % 7] + o*12; }

function playMusic(track){
  if(!AU.ctx){ AU.pending = track; return; }
  if(AU.track === track) return;
  stopMusicNodes(); AU.track = track;
  const root = 38; // D2
  let beat = 0;
  if(track === 'menu'){
    drone([midi(root - 12), midi(root - 5)], 'sawtooth', 220, 0.12, 0.05);
    AU.timer = setInterval(() => {
      beat++;
      if(beat % 6 === 0) bell(midi(scaleNote(root + 24, Math.floor(Math.random()*8))), 0.05, 6);
      if(beat % 16 === 8) pad([midi(root + 12), midi(root + 13), midi(root + 19)], 0.03, 8);
      if(Math.random() < 0.015) sfx('whisper');
    }, 500);
  } else if(track === 'town'){
    drone([midi(root - 12)], 'triangle', 300, 0.1, 0.04);
    const chords = [[0, 3, 7], [-4, 0, 3], [-7, -4, 0], [-5, -1, 2]];
    AU.timer = setInterval(() => {
      if(beat % 16 === 0){ const ch = chords[(beat/16) % 4]; pad(ch.map(n => midi(root + 12 + n)), 0.025, 9); }
      if(beat % 4 === 2 && Math.random() < 0.6) bell(midi(scaleNote(root + 24, Math.floor(Math.random()*7))), 0.035, 4);
      beat++;
    }, 500);
  } else if(track === 'dungeon'){
    drone([midi(root - 12), midi(root - 11)], 'sawtooth', 160, 0.14, 0.03);
    AU.timer = setInterval(() => {
      beat++;
      if(beat % 3 === 0){ thump(0.18); thump(0.12, 0.22); }
      if(beat % 7 === 0) bell(midi(scaleNote(root + 12, Math.floor(Math.random()*9))), 0.05, 7);
      if(beat % 24 === 12) pad([midi(root), midi(root + 1), midi(root + 6)], 0.03, 10);
      if(Math.random() < 0.012) sfx('whisper');   // about once a minute at most (the sound itself waits 45 s between)
    }, 470);
  } else if(track === 'boss'){
    drone([midi(root - 12), midi(root - 6)], 'sawtooth', 300, 0.16, 0.2);
    AU.timer = setInterval(() => {
      beat++;
      thump(beat % 2 ? 0.16 : 0.3);
      if(beat % 4 === 0) noiseHit(0.1, 0.12, 'highpass', 5000, null, AU.musicBus);
      if(beat % 8 === 0) pad([midi(root), midi(root + 3), midi(root + 6)], 0.05, 3);
      if(beat % 8 === 4) pad([midi(root + 1), midi(root + 5), midi(root + 8)], 0.05, 3);
      if(beat % 3 === 0) bell(midi(scaleNote(root + 24, Math.floor(Math.random()*7))), 0.03, 2);
    }, 260);
  }
}

// ============ WORLD: town, dungeon generation, map art, FOV ============

let rngState = 1;

const R = Math.random;
const RRI = (a, b) => a + Math.floor(R()*(b - a + 1));

function newMap(w, h, fill){ return {w, h, t:new Uint8Array(w*h).fill(fill), explored:new Uint8Array(w*h), vis:new Uint8Array(w*h)}; }
function tAt(M, x, y){ return (x < 0 || y < 0 || x >= M.w || y >= M.h) ? T_WALL : M.t[y*M.w + x]; }

function walkT(M, t){ return WALKABLE.has(t) || (t === T_SEAL && !!M.sealOpen); }

// ---- the bottom-wall lip (2026-11-14, Mathis: "walk in that section on the bottom walls so it shows the dungeon has depth"): a body
// may step LIP px into a wall tile when the tile above it is floor and the tile below it is wall (the thick bottom wall of a room),
// the end tiles beside a corridor's mouth too (Mathis: "the ends ... block off"). render.js draws that wall again in front of whoever stands there,
// so their legs go behind it. Sight, monster paths and lines of sight count a body there as standing on the floor tile above.
const LIP = 11;
function lipCalc(M, tx, ty){ return tAt(M, tx, ty) === T_WALL && tAt(M, tx, ty + 1) === T_WALL && walkable(M, tx, ty - 1); }
function lipMap(M){ const key = M.sealOpen ? 2 : 1; if(M.lipK && M.lipKey === key) return M.lipK;   // worked out once per map (again when the seal opens)
  const W = M.w, L = new Uint8Array(W*M.h); for(let y = 1; y < M.h; y++) for(let x = 0; x < W; x++) if(lipCalc(M, x, y)) L[y*W + x] = 1;

function lipTile(M, tx, ty){ return !M.isTown && tx >= 0 && ty >= 0 && tx < M.w && ty < M.h && lipMap(M)[ty*M.w + tx] === 1; }
function inLip(M, px, py){ const ty = Math.floor(py/TS); return py - ty*TS < LIP && lipTile(M, Math.floor(px/TS), ty); }
function bodyTY(M, px, py){ const ty = Math.floor(py/TS); return py - ty*TS < LIP && lipTile(M, Math.floor(px/TS), ty) ? ty - 1 : ty; }   // the tile row a body counts as standing on

// ---------------- TOWN OF PALLI ----------------
function genTown(){
  const M = newMap(42, 32, T_GRASS);
  M.isTown = true; M.name = 'Palli'; M.theme = 'town';
  srand(777);
  // border trees
  for(let y = 0; y < M.h; y++) for(let x = 0; x < M.w; x++){
    if(x < 2 || y < 2 || x >= M.w - 2 || y >= M.h - 2) setT(M, x, y, T_TREE);
  }
  // river Sarai (west side, meandering)
  for(let y = 0; y < M.h; y++){ const cx = 5 + Math.round(Math.sin(y*0.35)*1.2); for(let x = cx - 1; x <= cx + 1; x++) setT(M, x, y, T_WATER); }
  // paths
  const path = (x0, y0, x1, y1) => { let x = x0, y = y0; while(x !== x1){ setT(M, x, y, T_PATH); setT(M, x, y + 1, T_PATH); x += Math.sign(x1 - x); } while(y !== y1){ setT(M, x, y, T_PATH); setT(M, x + 1, y, T_PATH); y += Math.sign(y1 - y); } setT(M, x, y, T_PATH); };

  M.houses = [{x:28, y:7, w:7, h:5, roof:'#5a2e22', name:'forge'}, {x:10, y:7, w:6, h:5, roof:'#2f4a2f', name:'hut'}, {x:9, y:22, w:6, h:4, roof:'#3a2a52', name:'ganesh'}];

  M.torches = [{x:20, y:15, post:true}, {x:23, y:18, post:true}, {x:32.6, y:12.6, post:true}, {x:15, y:13, post:true}, {x:18, y:22, post:true}, {x:20, y:9, post:true}];
  M.forge = {x:27.5, y:10.5};
  M.start = {x:8*TS + 8, y:18*TS + 4};
  M.objects = [
    {type:'npc', id:'karmara', x:27*TS + 14, y:12*TS + 8, name:'Karmara', role:'Blacksmith'},
    {type:'npc', id:'vaidya',  x:13*TS + 8, y:13*TS + 6, name:'Vaidya', role:'Healer'},
    {type:'npc', id:'ganesh',  x:10*TS + 2, y:21*TS + 8, name:'Ganesh', role:'Storyteller'},
    {type:'rift', x:21*TS + 8, y:5*TS + 8, name:'The Rift'},
    {type:'stone', x:22*TS + 8, y:13*TS, name:'Portal Stone'},
    {type:'stash', x:25*TS + 8, y:14*TS + 12, name:'Shared Chest'}

  M.props = [{kind:'anvil', x:27*TS + 4, y:12*TS + 10}, {kind:'well', x:18*TS + 8, y:18*TS + 8}, {kind:'cart', x:33*TS, y:14*TS}, {kind:'barrel', x:35*TS + 2, y:12*TS + 6}, {kind:'barrel', x:16*TS + 4, y:11*TS + 10}, {kind:'grave', x:12*TS, y:20*TS}];

// ground footprints (ellipses at the base) of the town things you can't walk through: [half width, half depth, x shift]
const PROP_FOOT = {well:[8.8, 5], anvil:[5, 2.2, 1], barrel:[5, 3], crate:[5.6, 3], cart:[8, 3.6, -3.1], hay:[7, 3.2], sack1:[4.6, 2.6], sack2:[5.6, 2.2], grave:[5.6, 2.4], lamp:[2.4, 1.5], rubble:[14, 4.5]};
function townSolids(M){
  const out = [], foot = (x, y, rx, ry) => out.push({x, y:y - ry, rx, ry});
  if(typeof TOWN_MAN !== 'undefined') for(const [k, x, y, flip, sc = 1] of TOWN_MAN.place){ const f = PROP_FOOT[k]; if(f) foot(x + (flip ? -1 : 1)*(f[2] || 0)*sc, y, f[0]*sc, f[1]*sc); }
  for(const o of M.objects){ if(o.type === 'stash') foot(o.x, o.y + 2, 8.8, 3.6); else if(o.type === 'stone') foot(o.x, o.y + 2, 7.5, 3.2); }
  return out;
}

// ---------------- STAIRS ----------------
// down at the exit (not on the last depth), up just above the start (to the depth above, or to Palli from depth 1);
// you walk around them and press to use them
function placeStairs(M, start){
  const fl = (x, y) => tAt(M, x, y) === T_FLOOR, box = (x, y) => { for(let j = -1; j <= 1; j++) for(let i = -1; i <= 1; i++) if(!fl(x + i, y + j)) return false; return true; };
  for(const [dx, dy] of [[0, -1], [0, -2], [-1, -1], [1, -1], [0, 0], [-2, -1], [2, -1], [0, 1]]){
    const x = start.cx + dx, y = start.cy + dy;
    if(box(x, y) && fl(x, y + 2)){ M.objects.push({type:'stairsup', x:(x + 0.5)*TS, y:(y + 0.5)*TS, tx:x, ty:y}); M.start = {x:(x + 0.5)*TS, y:(y + 2)*TS + 4}; break; }
  }
  if(tAt(M, M.exit.x, M.exit.y) === T_EXIT) addStairsDown(M);
}
function addStairsDown(M){
  if(M.level >= 10 || M.objects.some(o => o.type === 'stairsdown')) return null;
  const o = {type:'stairsdown', x:(M.exit.x + 0.5)*TS, y:(M.exit.y + 0.5)*TS, tx:M.exit.x, ty:M.exit.y}; M.objects.push(o);
  if(M.solids) stairsSolid(M, o);
  return o;
}
function stairsSolid(M, o){ M.solids.push({x:o.x, y:o.y, rx:12, ry:9}); if(M.propBlock) M.propBlock[o.ty*M.w + o.tx] = 1; }

// ---------------- DUNGEON PROPS ----------------
// which picture each prop gets (a hash of where it lies, so it never changes), and which pictures are solid things you walk around
const PROP_IX = {crypt:{bones:1, skull:2, candles:3, urn:4}, flesh:{pustule:1, bones:2, eggs:3, meat:4}, void:{crystal:1, bones:2, eye:3, candles:4}, throne:{bones:1}};
function propIdx(theme, p){ if(p.ix) return p.ix; const h = Math.abs((p.x*13 + p.y*7) | 0) % 100, m = PROP_IX[theme] || {};
  return p.ix = h < 25 ? 5 + (h % 2) : (m[p.kind] || 1 + h % 6); }
// ground footprints (half width, half depth) of the props that stand up: sarcophagus, urn, statue head, egg cluster, ribcage, crystal, fallen column, skull pile, brazier, spike
const PROP_SOLID = {crypt:{4:[3.2, 1.8], 5:[15, 4.2], 6:[7, 3.4]}, flesh:{3:[5, 2.8], 6:[9, 3.4]}, void:{1:[2.6, 1.6], 6:[14.5, 3.8]}, throne:{2:[7, 3], 3:[5.5, 3], 5:[3, 1.8]}};
const PROP_SMALL = {crypt:[1, 2, 3], flesh:[1, 2, 4, 5], void:[2, 3, 4, 5], throne:[1, 4, 6]};
function settleProps(M){
  const solids = [], block = new Uint8Array(M.w*M.h), urns = [], FS = PROP_SOLID[M.theme] || {}, gap = 14;   // a hero (r 6) always fits between a solid prop and a wall
  const clear = (x0, y0, x1, y1) => { for(let ty = Math.floor(y0/TS); ty <= Math.floor(y1/TS); ty++) for(let tx = Math.floor(x0/TS); tx <= Math.floor(x1/TS); tx++) if(tAt(M, tx, ty) !== T_FLOOR) return false; return true; };
  const near = (x, y, rx, ry, pts) => pts.some(o => Math.abs(o.x - x) < rx && Math.abs(o.y - y) < ry);
  const marks = M.objects.concat([M.start, M.exit ? {x:(M.exit.x + 0.5)*TS, y:(M.exit.y + 0.5)*TS} : null].filter(Boolean));
  for(const p of M.props){
    const ix = propIdx(M.theme, p), f = FS[ix]; p.up = false; if(!f) continue;
    const [rx, ry] = f, cy = p.y - ry, A = M.arena;
    const ok = clear(p.x - rx - gap, cy - ry - gap, p.x + rx + gap, p.y + gap) && !near(p.x, cy, rx + 22, ry + 22, marks)
      && !solids.some(s => Math.abs(s.x - p.x) < s.rx + rx + gap && Math.abs(s.y - cy) < s.ry + ry + gap)
      && !(A && p.x > (A.x - 1)*TS && p.x < (A.x + A.w + 1)*TS && p.y > (A.y - 1)*TS && p.y < (A.y + A.h + 1)*TS);
    if(!ok){ const sm = PROP_SMALL[M.theme] || [1]; p.ix = sm[Math.abs((p.x*7 + p.y*3) | 0) % sm.length]; continue; }   // no room for it here: a small piece lies there instead
    p.up = true; const sol = {x:p.x, y:cy, rx, ry}; solids.push(sol); p.solid = sol; p.tiles = [];
    for(let ty = Math.floor((cy - ry - 5)/TS); ty <= Math.floor((p.y + 5)/TS); ty++) for(let tx = Math.floor((p.x - rx - 5)/TS); tx <= Math.floor((p.x + rx + 5)/TS); tx++){
      const dx = ((tx + 0.5)*TS - p.x)/(rx + 5), dy = ((ty + 0.5)*TS - cy)/(ry + 5); if(dx*dx + dy*dy < 1){ block[ty*M.w + tx] = 1; p.tiles.push(ty*M.w + tx); } }   // monsters path around it
    if(M.theme === 'crypt' && ix === 4) urns.push(p);                                              // urns break when hit
    if(M.theme === 'crypt' && ix === 5) M.objects.push({type:'sarc', x:p.x, y:p.y - 4, prop:p});  // sarcophagi can be opened
  }
  const S = typeof DEPTH_MAN !== 'undefined' && DEPTH_MAN[M.theme] && DEPTH_MAN[M.theme].s;   // a flat prop whose picture would reach into a wall (the wall face is drawn over it) moves clear, or is left out
  if(S) M.props = M.props.filter(p => {
    if(p.up) return true; const r = S['prop' + propIdx(M.theme, p)]; if(!r) return true;
    const fits = (x, y) => { const l = x - r[4]/6 + 0.5, t = y - r[5]/6 + 0.5, rr = l + r[2]/6 - 1, bb = t + r[3]/6 - 1; if(tAt(M, Math.floor(x/TS), Math.floor(y/TS)) !== T_FLOOR) return false;
      for(let ty = Math.floor(t/TS); ty <= Math.floor(bb/TS); ty++) for(let tx = Math.floor(l/TS); tx <= Math.floor(rr/TS); tx++) if(tAt(M, tx, ty) === T_WALL) return false; return true; };
    if(fits(p.x, p.y)) return true;
    for(const [dx, dy] of [[0, 3], [0, 6], [0, 9], [0, 12], [4, 0], [-4, 0], [8, 0], [-8, 0], [4, 6], [-4, 6], [8, 8], [-8, 8], [0, 16]]) if(fits(p.x + dx, p.y + dy)){ p.x += dx; p.y += dy; return true; }
    return false; });
  // a flat piece never lies under the stairs, a chest, a shrine, a note or the hero's first step, inside a standing piece, under a statue, or on another flat piece
  const A = M.arena, stat = !A ? [] : M.theme === 'crypt' ? [{x:(A.x + 2.6)*TS, y:(A.y + 2)*TS}, {x:(A.x + A.w - 2.6)*TS, y:(A.y + 2)*TS}] : M.theme === 'throne' ? [{x:(A.x + A.w/2)*TS, y:(A.y + 3.4)*TS}] : [], kept = [];
  M.props = M.props.filter(p => { if(p.up) return true; const y = p.y - 3;
    if(marks.some(o => { const st = o.type === 'stairsup' || o.type === 'stairsdown' || (!o.type && o !== M.start), rx = st ? 21 : 13, ry = st ? 18 : 10; return Math.abs(o.x - p.x) < rx && Math.abs(o.y - y) < ry; })) return false;
    if(solids.some(q => Math.abs(q.x - p.x) < q.rx + 6 && Math.abs(q.y - y) < q.ry + 5)) return false;
    if(stat.some(q => Math.abs(q.x - p.x) < 18 && p.y > q.y - 30 && p.y < q.y + 6)) return false;
    if(kept.some(q => Math.abs(q.x - p.x) < 11 && Math.abs(q.y - p.y) < 7)) return false;
    kept.push(p); return true; });
  M.solids = solids; M.propBlock = block; M.urns = urns;
  for(const o of M.objects) if(o.type === 'stairsup' || o.type === 'stairsdown') stairsSolid(M, o);
}

// ---------------- DUNGEON ----------------
function genDungeon(L, seed, diff){
  srand(seed);
  const lv = LEVELS[L - 1];
  const W = 58 + L*7 + (lv.quest ? 8 : 0), H = 44 + L*5 + (lv.quest ? 16 : 0);
  // quest levels keep a solid strip along the bottom edge for the sealed chamber
  const maxY = lv.quest ? H - 17 : H;
  const M = newMap(W, H, T_WALL);
  M.level = L; M.diff = diff || 'breeze'; M.name = lv.name; M.theme = lv.theme; M.torches = []; M.props = []; M.objects = []; M.monsters = []; M.items = [];
  const rooms = [];
  const overlap = (x, y, w, h) => rooms.some(r => x < r.x + r.w + 3 && x + w + 3 > r.x && y < r.y + r.h + 3 && y + h + 3 > r.y);
  if(lv.boss){ // arena first
    const w = lv.boss === 'ilvaroth' ? 24 : 18, h = lv.boss === 'ilvaroth' ? 18 : 14;
    const x = W - w - 3, y = RI(3, maxY - h - 3);
    rooms.push({x, y, w, h, arena:true});
  }
  const target = 9 + Math.floor(L*1.6);
  for(let i = 0; i < 900 && rooms.length < target + (lv.boss ? 1 : 0); i++){
    const w = RI(8, 15), h = RI(7, 11), x = RI(2, W - w - 3), y = RI(3, maxY - h - 3);
    if(overlap(x, y, w, h)) continue;
    rooms.push({x, y, w, h});
  }
  rooms.forEach(r => { r.cx = r.x + (r.w >> 1); r.cy = r.y + (r.h >> 1); for(let j = r.y; j < r.y + r.h; j++) for(let i = r.x; i < r.x + r.w; i++) setT(M, i, j, T_FLOOR); });
  // linear order: start = leftmost non-arena room, greedy nearest-neighbour chain, arena last
  const arena = rooms.find(r => r.arena);
  let pool = rooms.filter(r => !r.arena);
  pool.sort((a, b) => a.cx - b.cx);
  const order = [pool.shift()];
  while(pool.length){
    const last = order[order.length - 1];
    let bi = 0, bd = 1e9;
    pool.forEach((r, i) => { const d = Math.abs(r.cx - last.cx) + Math.abs(r.cy - last.cy)*1.2; if(d < bd){ bd = d; bi = i; } });
    order.push(pool.splice(bi, 1)[0]);
  }
  if(arena) order.push(arena);
  const corr = (a, b) => {
    let x = a.cx, y = a.cy; const hf = rnd() < 0.5;
    const dig = (x, y) => { for(let j = 0; j < 3; j++) for(let i = 0; i < 3; i++) if(tAt(M, x + i - 1, y + j - 1) === T_WALL && x + i - 1 > 0 && y + j - 1 > 1 && x + i < W - 1 && y + j < H - 1) setT(M, x + i - 1, y + j - 1, T_FLOOR); };
    const hx = () => { while(x !== b.cx){ dig(x, y); x += Math.sign(b.cx - x); } };
    const vy = () => { while(y !== b.cy){ dig(x, y); y += Math.sign(b.cy - y); } };
    if(hf){ hx(); vy(); } else { vy(); hx(); }
    dig(x, y);
  };
  for(let i = 1; i < order.length; i++) corr(order[i - 1], order[i]);
  M.rooms = order;
  // pillars in larger rooms (decor + cover), away from centre lines
  order.forEach((r, i) => {
    if(r.arena || r.w < 12 || r.h < 9 || i === 0) return;
    if(rnd() < 0.6){ [[r.x + 2, r.y + 2], [r.x + r.w - 3, r.y + 2], [r.x + 2, r.y + r.h - 3], [r.x + r.w - 3, r.y + r.h - 3]].forEach(([px, py]) => setT(M, px, py, T_WALL)); }
  });
  if(arena && lv.boss === 'ilvaroth'){ // ring of pillars
    for(let k = 0; k < 8; k++){ const a = k/8*Math.PI*2; setT(M, Math.round(arena.cx + Math.cos(a)*8), Math.round(arena.cy + Math.sin(a)*6), T_WALL); }
  }
  // sealed quest chamber (side room off the main path)
  if(lv.quest){
    const qw = 15, qh = 11; let qr = null;
    for(let t = 0; t < 1500 && !qr; t++){
      const x = RI(3, W - qw - 4), y = t < 1200 ? H - qh - 3 : RI(4, H - qh - 4); let ok = true;
      for(let j = y - 3; j < y + qh + 3 && ok; j++) for(let i = x - 3; i < x + qw + 3; i++) if(tAt(M, i, j) !== T_WALL){ ok = false; break; }
      if(ok) qr = {x, y, w:qw, h:qh};
    }
    if(qr){
      qr.cx = qr.x + (qw >> 1); qr.cy = qr.y + (qh >> 1); qr.quest = true;
      for(let j = qr.y; j < qr.y + qh; j++) for(let i = qr.x; i < qr.x + qw; i++) setT(M, i, j, T_FLOOR);
      let near = null, nd = 1e9;
      order.forEach((r, i) => { if(i === 0 || r.arena) return; const d = Math.abs(r.cx - qr.cx) + Math.abs(r.cy - qr.cy); if(d < nd){ nd = d; near = r; } });
      corr(near || order[1], qr);
      M.sealTiles = [];
      for(let j = qr.y - 1; j <= qr.y + qh; j++) for(let i = qr.x - 1; i <= qr.x + qw; i++){
        const ringT = i === qr.x - 1 || i === qr.x + qw || j === qr.y - 1 || j === qr.y + qh;
        if(ringT && tAt(M, i, j) === T_FLOOR){ setT(M, i, j, T_SEAL); M.sealTiles.push({x:i, y:j}); }
      }
      [[qr.x + 2, qr.y + 2], [qr.x + qw - 3, qr.y + 2], [qr.x + 2, qr.y + qh - 3], [qr.x + qw - 3, qr.y + qh - 3]].forEach(([px, py]) => setT(M, px, py, T_WALL));
      if(M.sealTiles.length){ const sx = M.sealTiles.reduce((a, t) => a + t.x, 0)/M.sealTiles.length, sy = M.sealTiles.reduce((a, t) => a + t.y, 0)/M.sealTiles.length; M.objects.push({type:'seal', x:sx*TS + 8, y:sy*TS + 8}); }
      M.questRoom = qr; M.quest = lv.quest;
    }
  }
  const start = order[0], end = order[order.length - 1];

  M.startRoom = start;
  // exit
  const ex = arena ? {x:arena.cx, y:arena.y + 1} : {x:end.cx, y:end.cy};
  M.exit = ex;
  if(!arena) setT(M, ex.x, ex.y, T_EXIT);
  placeStairs(M, start);

  const taken = M.objects.filter(o => o.type === 'stairsup' || o.type === 'stairsdown').map(o => ({x:o.x, y:o.y, r:14}));
  taken.push({x:M.start.x, y:M.start.y, r:8}, {x:(ex.x + 0.5)*TS, y:(ex.y + 0.5)*TS, r:14});

  });

  const freeSpot = (r, pad = 1) => { for(let t = 0; t < 40; t++){ const x = RI(r.x + pad, r.x + r.w - 1 - pad), y = RI(r.y + pad, r.y + r.h - 1 - pad); if(tAt(M, x, y) === T_FLOOR && !(x === ex.x && y === ex.y)) return {x, y}; } return null; };
  order.forEach(r => {
    for(let k = 0; k < RI(1, 4); k++){ const s = freeSpot(r, 0); if(s) M.props.push({kind:pick(lv.theme === 'crypt' ? ['bones', 'bones', 'skull', 'candles', 'urn'] : lv.theme === 'flesh' ? ['pustule', 'bones', 'eggs', 'meat'] : ['crystal', 'bones', 'eye', 'candles']), x:s.x*TS + RI(2, 12), y:s.y*TS + RI(4, 12)}); }
  });
  // a free tile of room r at least `gap` px clear of everything placed so far (the gap eases if the room is crowded)
  const objSpot = (r, gap = 26) => { for(const g of [gap, gap*0.7, gap*0.45]) for(let t = 0; t < 40; t++){ const s = freeSpot(r); if(!s) break;
      const x = s.x*TS + 8, y = s.y*TS + 8; if(!taken.some(o => Math.abs(o.x - x) < g + o.r && Math.abs(o.y - y) < g + o.r)) return s; } return null; };
  // story objects
  const notes = NOTES[L - 1];
  const nr1 = order[Math.max(1, Math.floor(order.length*0.35))], nr2 = order[Math.max(2, Math.floor(order.length*0.7))];
  if(notes[0]){ const s = claim(objSpot(nr1) || freeSpot(nr1)); if(s) M.objects.push({type:'papyrus', note:0, x:s.x*TS + 8, y:s.y*TS + 8}); }
  if(notes[1]){

    else if(L === 9){ M.bossNote = 1; } // Vessa's last words: revealed by the boss
    else { const s = claim(objSpot(nr2) || freeSpot(nr2)); if(s) M.objects.push({type:'corpse', note:1, x:s.x*TS + 8, y:s.y*TS + 8}); }
  }
  // chests
  const nChest = 1 + Math.floor(L/3) + (rnd() < 0.5 ? 1 : 0);
  for(let k = 0; k < nChest; k++){ const r = order[RI(1, order.length - 1)]; if(r.arena) continue; const s = claim(objSpot(r)); if(s) M.objects.push({type:'chest', x:s.x*TS + 8, y:s.y*TS + 8}); }

  if(rnd() < 0.7){ const r = order[RI(2, Math.max(2, order.length - 2))]; const s = r && !r.arena && claim(objSpot(r)); if(s) M.objects.push({type:'shrine', kind:pick(['power', 'speed', 'life']), x:s.x*TS + 8, y:s.y*TS + 8}); }

  M.spawns = [];
  order.forEach((r, i) => {
    if(i === 0 || r.arena) return;

    }
  });
  if(arena) M.arena = arena;
  M.boss = lv.boss;
  settleProps(M);
  return M;
}

function computeFOV(M, px, py, R, keep){   // keep: add to what is already visible (the second hero's view)

  if(M.isTown){ for(let i = 0; i < M.vis.length; i++){ M.vis[i] = 1; M.explored[i] = 1; } return; }
  for(let j = -R; j <= R; j++) for(let i = -R; i <= R; i++){

    const tx = cx + i, ty = cy + j; if(tx < 0 || ty < 0 || tx >= M.w || ty >= M.h) continue;

    for(let s = 1; s < n; s++){ const sx = Math.round(cx + i*s/n), sy = Math.round(cy + j*s/n); if(sightBlocks(M, sx, sy)){ ok = false; break; } }

}

  const q = new Int32Array(M.w*M.h); let h = 0, tl = 0; q[tl++] = sy*W + sx; F[sy*W + sx] = 0;

  let a = k, b = k + 1; while(a > 0 && wxSlot(a - 1) === kind && k - a < 80) a--; while(wxSlot(b) === kind && b < k + 80) b++;
  const v = Math.min(1, (t - a*WX_SLOT)/WX_RAMP, (b*WX_SLOT - t)/WX_RAMP); return v*v*(3 - 2*v);
}
function wxStart(P){ WX.snowArt = !!TOWN_MAN_SNOW; WX.seed = null; G.snowCover = 0; if(!P.wxSeed) P.wxSeed = (Math.random()*2147483647 | 0) || 7; G.wxSeed = P.wxSeed; G.wt = P.wt != null ? P.wt : WX_START; }   // a new hero wakes at 8 in the morning

// ---------------- bloody footprints ----------------
// A hero who walks through spilt blood (or a wraith's ichor, or a spitter's green) carries it on their boots: the next steps leave prints,
// fainter each step, and the prints fade from the floor after a while. Bone dust leaves none.
const PRINT_COL = [[96, 10, 20], null, [78, 28, 110], [58, 112, 26]];   // by splat group: blood, dust, ichor, green
const PRINT_STEPS = 10, PRINT_LIFE = 9;
function footPrint(h, sf){
  for(const d of G.decals){ const grp = Math.floor((d.f || 0)/3); if(!PRINT_COL[grp]) continue;
    if(Math.abs(d.x - h.x) < d.r*1.1 && Math.abs(d.y - h.y) < d.r*1.1 && Math.hypot(d.x - h.x, (d.y - h.y)*1.2) < d.r*1.05){ h.bloody = {n:PRINT_STEPS, c:PRINT_COL[grp]}; break; } }
  const ang = h._stepX != null && Math.hypot(h.x - h._stepX, h.y - h._stepY) > 0.8 ? Math.atan2(h.y - h._stepY, h.x - h._stepX) : (h._stepA ?? (h.face < 0 ? Math.PI : 0));
  h._stepX = h.x; h._stepY = h.y; h._stepA = ang;
  if(G.M && G.M.isTown && typeof townCover === 'function' && townCover() > 0.4 && !(h.bloody && h.bloody.n > 0)){   // boots in lying snow
    const sd = sf === 0 ? 1 : -1; G.prints.push({x:h.x - Math.sin(ang)*1.7*sd, y:h.y + 0.5 + Math.cos(ang)*1.7*sd*0.8, ang, k:0.55, c:[72, 78, 96], t0:G.time}); if(G.prints.length > 90) G.prints.shift(); return; }   // a cool shadow pressed in the snow (a darker wet spot on the slush of the paths)
  const B = h.bloody; if(!B || B.n <= 0) return;
  const side = sf === 0 ? 1 : -1;
  G.prints.push({x:h.x - Math.sin(ang)*1.7*side, y:h.y + 0.5 + Math.cos(ang)*1.7*side*0.8, ang, k:B.n/PRINT_STEPS, c:B.c, t0:G.time});
  if(G.prints.length > 90) G.prints.shift();
  if(--B.n <= 0) h.bloody = null;
}

  G.projs = []; G.fx = []; G.prints = []; for(const h of party()) h.bloody = null; G.loot = G.loot.filter(l => keep.has(l.map)); G.decals = M.decals || (M.decals = []);

// ---------------- interactions ----------------
function fightNear(P, M){ return !M.isTown && M.monsters.some(m => m.hp > 0 && !m.dead && (m.alert || m.boss) && Math.hypot(m.x - P.x, m.y - P.y) < 110); }   // a monster close enough to be a fight
function nearestInteract(){
  const P = G.P, M = G.M; let best = null, bd = 1e9, lore;
  for(const o of M.objects){
    if(o.type === 'bossbody' || (o.used && (o.type === 'chest' || o.type === 'shrine' || o.type === 'sarc'))) continue;
    if(o.type === 'seal' && M.sealOpen) continue;
    if((o.type === 'papyrus' || o.type === 'corpse') && (lore === undefined ? (lore = !lootNear() && !fightNear(P, M)) : lore) === false) continue;   // items and fights come first
    const d = Math.hypot(o.x - P.x, o.y - P.y); const rr = o.type === 'rift' ? 34 : o.type === 'npc' || o.type === 'seal' || o.type === 'stairsup' || o.type === 'stairsdown' || o.type === 'sarc' ? 30 : 24;
    if(d < rr && d < bd){ bd = d; best = o; }
  }
  const l = lootNear(); if(l && (!best || Math.hypot(l.x - P.x, l.y - (P.y - 2)) < bd)) best = lootObj(l);
  return best;
}
function interactLabel(o){

  if(o.type === 'stairsdown') return `Descend to Depth ${G.M.level + 1}`;
  return {npc:'Talk', papyrus:'Read', corpse:'Search', chest:'Open', rift:'Enter Rift', tp:'Enter Portal', stone:'Portal Stone', homeportal:'Return to Palli', shrine:'Touch Shrine', stash:'Open Chest', seal:'Inspect Seal', sarc:'Open Sarcophagus'}[o.type] || 'Use';
}
function interact(o){

  switch(o.type){
    case 'npc': talkTo(o.id); break;
    case 'papyrus': case 'corpse': readNote(G.M.level, o.note, o); break;
    case 'chest': openChest(o); break;
    case 'sarc': openSarc(o); break;
    case 'stairsdown': if(!G.fading) descend(); break;
    case 'stairsup': if(!G.fading) ascend(); break;
    case 'rift': showRiftMenu(); break;
    case 'tp': if(G.M.isTown) usePortalBack(); else { G.M.objects = G.M.objects.filter(x => x !== o); G.portal = null; goTown(true); } break;
    case 'stone': toast(G.portal ? 'Your portal shimmers beside the stone.' : 'Town portals you open in the depths will appear here.', '#b98cff'); break;
    case 'homeportal': goTown(true); break;
    case 'stash': G.stash = loadStash(); UI.tab = 'stash'; openPanel('stash'); break;
    case 'seal': toast(QUESTS[G.M.quest].seal, '#b98cff', 6); break;
    case 'shrine': {
      o.used = true; sfx('shrine', o);
      if(o.kind === 'power'){ addBuff('power', 30); toast('Shrine of Power: +25% damage for 30 seconds.', '#ef7d57'); }

function ascendItem(ref){
  const P = G.P, it = refItem(ref); if(!it) return;

  const from = rarityDef(it.rarity), to = rarityDef(c.to), k = to.mult/from.mult;

function imbueHit(m, amt){            // the oil's effect on a monster struck by a normal attack

// ============ SIM: per-frame updates ============

function update(dt){

function updatePlayer(dt){

function learnSkill(id){

  if(P.skillPts <= 0 || r >= SKILL_MAX || P.lvl < SKILL_REQ[i] || P.lvl < rankReq(i, r + 1)) return;

function questStatus(q){
  const P = G.P, Q = QUESTS[q], st = P.quests[q];

  if(st === 'killed') return `<span style="color:var(--gold)">Return to ${Q.giverName} in Palli.</span>`;
  if(st === 'active') return esc(Q.desc);
  return P.done >= Q.reqDone ? `<span style="color:var(--gold)">Speak with ${Q.giverName} in Palli.</span>` : `<span class="sub">Not yet discovered.</span>`;
}

// ---------------- NPCs & quests ----------------
function questOption(q){
  const P = G.P, Q = QUESTS[q], st = P.quests[q], who = Q.giverName, kind = Q.giver;
  if(st === 'none' && P.done >= Q.reqDone) return {label: q === 'aldren' ? 'Captain Aldren?' : 'Your apprentice?', fn:() => showDialog(who, Q.offer, [{label:'I will find him', fn:() => acceptQuest(q)}, {label:'Not yet', fn:closeDialog}].map(o => q === 'broodmother' && o.label === 'I will find him' ? {...o, label:'I will find her'} : o), kind)};
  if(st === 'active') return {label:Q.name, fn:() => showDialog(who, Q.active, [{label:'Farewell', fn:closeDialog}], kind)};
  if(st === 'killed') return {label: q === 'aldren' ? 'Aldren is at rest' : 'About Niru...', fn:() => completeQuest(q)};
  return null;
}
function acceptQuest(q){
  const P = G.P; P.quests[q] = 'active'; closeDialog(); sfx('page'); sfx('seal');
  toast(`New quest: ${QUESTS[q].name}`, '#ffcd75', 4); saveGame(); UI.dirty = true;
}
function completeQuest(q){
  const P = G.P, Q = QUESTS[q];
  const gold = 100 + 30*P.lvl, carbon = 3;
  const it = makeGear(R() < 0.15 ? 'heroic' : 'grand', rpick(['weapon', 'helm', 'chest', 'gloves', 'boots']), P.cls);
  P.gold += gold; P.carbon += carbon; P.quests[q] = 'done';
  const slot = P.inv.indexOf(null); if(slot >= 0){ P.inv[slot] = it; autoSort(P); } else dropLoot({item:it}, P.x, P.y);
  let extra = '';
  if(q === 'broodmother'){ P.pots.hp = Math.min(10, P.pots.hp + 3); extra = ', 3 Health Potions'; }
  sfx('legend'); saveGame(); UI.dirty = true;
  showDialog(Q.giverName, Q.complete + `\n\n(Received ${gold} gold, ${carbon} Carbon${extra}, and ${itemName(it)})`, [{label:'Farewell', fn:closeDialog}], Q.giver);
}
// Ganesh answers a question, then offers the questions again (Mathis's script in GANESH_ASK)
function ganeshAsk(line){
  const P = G.P, opts = [];
  for(const q of GANESH_ASK){ if(q.when && !q.when(P)) continue;
    opts.push({label:q.q, fn:() => { P.asked = P.asked || {}; P.asked[q.id] = true; if(q.heard){ P.heard = P.heard || {}; P.heard[q.heard] = true; } saveGame(); ganeshAsk(q.a); }}); }
  if(P.won && Math.min(10, P.done) === 10 && !P.endingSeen) opts.unshift({label:'Sit with him', fn:() => { closeDialog(); P.endingSeen = true; saveGame(); showEnding(); }});
  opts.push({label:'Farewell', fn:closeDialog});
  showDialog('Ganesh', line, opts, 'ganesh');
}
// once Ganesh has told the hero about Niru, Karmara and Vaidya can be asked about her (draft lines), until her fate is known
function niruOption(who){
  const P = G.P, st = P.quests && P.quests.broodmother;
  if(!(P.heard && P.heard.niru) || st === 'killed' || st === 'done') return null;
  const N = NIRU_ASK[who], name = who === 'karmara' ? 'Karmara' : 'Vaidya';
  return {label:N.q, fn:() => showDialog(name, N.a, [{label:'Farewell', fn:closeDialog}], who)};
}
function talkTo(id){
  const P = G.P; const first = !P.talked[id];
  if(id === 'ganesh'){
    P.talked.ganesh = true;
    const idx = Math.min(10, P.done);
    let line;
    if(first){ line = GANESH[0]; P.ganeshHeard = 0; }
    else if(P.ganeshHeard < idx){ line = GANESH[idx]; P.ganeshHeard = idx; }
    else { const again = ['malformed', 'nightmare'].find(d => P.wonDiff[d] && !P.ganeshAgain[d]); if(again){ line = GANESH_AGAIN[again]; P.ganeshAgain[again] = true; } else line = GANESH[idx]; }
    ganeshAsk(line);
    saveGame();
  } else if(id === 'karmara'){
    const shop = tab => () => { closeDialog(); genShopIfNeeded(); UI.tab = tab; UI.shopOpen = true; openPanel('shop'); };
    const opts = [{label:'Trade', fn:shop('buy')}, {label:'Upgrade gear', fn:shop('upgrade')}, {label:'Reforge', fn:shop('reforge')}, {label:'Repair', fn:shop('repair')}];
    const qo = questOption('aldren'); if(qo) opts.unshift(qo);
    const nq = niruOption('karmara'); if(nq) opts.splice(qo ? 1 : 0, 0, nq);
    opts.push({label:'Farewell', fn:closeDialog});
    if(first){ P.talked.karmara = true; P.pots.hp = Math.min(10, P.pots.hp + 2); showDialog('Karmara', KARMARA_INTRO + '\n\n(Received 2 Health Potions)', opts, 'karmara'); saveGame(); }
    else showDialog('Karmara', rpick(KARMARA_LINES), opts, 'karmara');
  } else if(id === 'vaidya'){
    const healed = P.hp < P.d.maxhp || P.mp < P.d.maxmp; P.hp = P.d.maxhp; P.mp = P.d.maxmp; P.poisoned = 0;
    if(healed){ sfx('potion'); burst(P.x, P.y - 8, 20, ['#a7f070', '#f4f4f4'], 40, -40, 0.8); }
    const opts = [{label:'Buy potions', fn:() => { closeDialog(); openPanel('healer'); }}];
    const qo = questOption('broodmother'); if(qo) opts.unshift(qo);
    const nq = niruOption('vaidya'); if(nq) opts.splice(qo ? 1 : 0, 0, nq);
    opts.push({label:'Farewell', fn:closeDialog});
    if(first){ P.talked.vaidya = true; showDialog('Vaidya', VAIDYA_INTRO, opts, 'vaidya'); saveGame(); }
    else showDialog('Vaidya', (healed ? 'There. Your wounds are closed.\n\n' : '') + rpick(VAIDYA_LINES), opts, 'vaidya');
  }
}

// ---------------- cutscenes: full-screen stills with a slow push-in and a line of text ----------------
// tap, click, E, Enter, Space or ✕: next; Esc, ○ or Skip: skip to the end. Lives in the dialog layer, so the hero can't move meanwhile.
const CUT = {on:false, shots:null, i:0, done:null};
function playCutscene(shots, done){   // shots: [{img, text}]; done() runs once when it ends or is skipped
  const imgs = shots.map(s => { if(!s.img) return null; const im = new Image(); im.src = s.img; return im; });
  CUT.on = true; CUT.shots = shots; CUT.imgs = imgs; CUT.i = -1; CUT.done = done;
  UI.dialog = true; INPUT.attack = false;
  const w = $('dlgwrap'); w.classList.remove('hide');
  w.innerHTML = '<div class="cut" id="cut"><div class="cbg" id="cutbg"></div><div class="cshot" id="cutshot"></div><div class="cvig"></div><div class="ctx"><div class="cline" id="cutline"></div><div class="row" id="dlgopts"></div></div></div>';
  $('cut').addEventListener('click', e => { if(!e.target.closest('.btn') && !CUT.vid) cutNext(); });   // a tap on a picture moves on; a video only skips with its button
  let shown = false; const go = () => { if(!shown && CUT.on){ shown = true; cutNext(); } };
  if(shots[0].video) go();   // a video starts at once, still inside the tap that began the game, so it may play with sound
  else { imgs[0].onload = go; imgs[0].onerror = () => { if(!shown){ shown = true; cutEnd(false); } };   // the picture is missing: no cutscene
    if(imgs[0].complete && imgs[0].naturalWidth) go(); else setTimeout(go, 3000); }
  requestAnimationFrame(() => { const c = $('cut'); if(c) c.classList.add('on'); });
}
function cutNext(){
  if(!CUT.on || CUT.busy) return;
  if(CUT.i >= CUT.shots.length - 1){ cutEnd(true); return; }
  cutStopVideo();
  CUT.i++; const sh = CUT.shots[CUT.i], last = CUT.i === CUT.shots.length - 1;
  CUT.busy = true; setTimeout(() => CUT.busy = false, 450);   // a double tap doesn't skip a shot
  if(sh.video){ cutVideo(sh); return; }
  $('cut').classList.remove('vid');
  $('cutbg').style.backgroundImage = `url("${sh.img}")`;
  $('cutshot').innerHTML = `<img src="${sh.img}" alt="" draggable="false" style="transform-origin:${sh.ox || '50%'} ${sh.oy || '45%'}">`;
  const ln = $('cutline'); ln.classList.remove('show'); ln.textContent = sh.text || ''; void ln.offsetWidth; ln.classList.add('show');
  const o = $('dlgopts'); o.innerHTML = '';
  const add = (label, gold, fn) => { const bt = document.createElement('button'); bt.className = 'btn' + (gold ? ' gold' : ''); bt.textContent = label; onTap(bt, () => { sfx('click'); fn(); }); o.appendChild(bt); };
  add(last ? 'Rise' : 'Next', true, cutNext);
  if(!last) add('Skip', false, () => cutEnd(true));
}
function cutVideo(sh){   // a full-screen video shot (the trailer): plays with its own sound, then the next shot; Skip moves on
  CUT.vid = true; $('cut').classList.add('vid'); $('cutbg').style.backgroundImage = 'none'; $('cutline').textContent = '';
  $('cutshot').innerHTML = `<video id="cutvid" playsinline webkit-playsinline preload="auto" disablepictureinpicture src="${sh.video}"></video>`;
  const o = $('dlgopts'); o.innerHTML = ''; const bt = document.createElement('button'); bt.className = 'btn gold'; bt.textContent = 'Skip'; onTap(bt, () => { sfx('click'); cutNext(); }); o.appendChild(bt);
  const v = $('cutvid'); musicHold(true);
  v.addEventListener('ended', () => { if(CUT.on && $('cutvid') === v) cutNext(); });
  v.addEventListener('error', () => { if(CUT.on && $('cutvid') === v){ CUT.busy = false; cutNext(); } });   // no video: straight on
  const p = v.play();
  if(p && p.catch) p.catch(e => { if(!e || e.name !== 'NotAllowedError' || !CUT.vid || $('cutvid') !== v) return; v.muted = true; v.play().catch(() => {});   // sound was refused: play silently, a tap turns it on
    const sb = document.createElement('button'); sb.className = 'btn csnd'; sb.textContent = 'Sound on'; onTap(sb, () => { v.muted = false; sb.remove(); }); $('cut').appendChild(sb); });
}
function cutStopVideo(){ if(!CUT.vid) return; CUT.vid = false; const v = $('cutvid'); if(v){ try{ v.pause(); v.removeAttribute('src'); v.load(); }catch(e){} } const sb = document.querySelector('.cut .csnd'); if(sb) sb.remove(); musicHold(false); }
function cutEnd(played){
  if(!CUT.on) return; cutStopVideo(); CUT.on = false;
  const c = $('cut'), fin = () => { closeDialog(); const f = CUT.done; CUT.done = null; CUT.shots = CUT.imgs = null; if(f) f(played); };
  if(c && played){ c.classList.remove('on'); setTimeout(fin, 650); } else fin();
}

const nfRx = (t, whole) => new RegExp((whole ? '^' : '') + t.split('').map(c => c + '+').join('') + (whole ? 's?$' : ''), whole ? '' : 'g');

  for(const t of terms){
    const rx = nfRx(t); let m;
    while((m = rx.exec(S))){
      const i = m.index, j = i + m[0].length;
      const innocent = allow.some(a => { for(let k = S.indexOf(a); k >= 0; k = S.indexOf(a, k + 1)) if(k <= i && k + a.length >= j) return true; return false; });
      if(!innocent) return true;

}
function nameBlocked(raw){
  const L = NF_L || (NF_L = JSON.parse(atob(NF_B).split('').reverse().join('')));
  if(L.d.some(d => raw.replace(/\s+/g, '').includes(d))) return true;
  const chunks = raw.split(/[\s_\-.,'"`~*#=:;\/\\^]+/).filter(Boolean);
  for(const one of ['i', 'l']){                     // '1' and '|' can stand for i or l
    const C = chunks.map(c => nfLetters(c, one)), CW = chunks.flatMap(c => c.replace(/([a-z])([A-Z])/g, '$1 $2').split(' ')).flatMap(w => [w, w.replace(/^\d+|\d+$/g, '')]).map(w => nfLetters(w, one)), S = [...C, ...CW];   // whole chunks and camel-case words (KidRaper)
    for(let i = 0; i < C.length; i++){              // spaced-out letters: "r a p e", "ra pe"
      if(C[i].length > 2) continue; let j = i, s = '';
      while(j < C.length && C[j].length <= 2){ s += C[j]; j++; }
      if(j - i > 1) S.push(s); i = j;
    }
    if(S.some(s => nfHit(s, L.s, L.a))) return true;
    if([...C, ...CW].some(w => L.w.some(t => nfRx(t, true).test(w)))) return true;
  }

}

function reportQueue(){ try{ return JSON.parse(stGet('md_reports') || '[]'); }catch(e){ return []; } }
function reportPost(r){
  if(!REPORT.form || !REPORT.f.text) return Promise.reject('not set up');
  const b = new URLSearchParams(); b.append(REPORT.f.kind, r.kind === 'bug' ? 'Bug' : 'Idea'); b.append(REPORT.f.text, r.text); if(REPORT.f.contact) b.append(REPORT.f.contact, r.contact || ''); if(REPORT.f.info) b.append(REPORT.f.info, r.info);
  return fetch(REPORT.form, {method:'POST', mode:'no-cors', body:b});   // the form doesn't answer across sites; a network error is the only failure we can see
}
async function reportFlush(){ const q = reportQueue(); if(!q.length || !navigator.onLine) return; const left = [];

  stSet('md_reports', JSON.stringify(left)); if(UI.panel === 'report') refreshPanel(); }
async function sendReport(){
  const t = (RPT.text || '').trim(); if(t.length < 5){ toast('Write a few words first.', '#e43b44'); return; }
  if(Date.now() - RPT.sent < 20000){ toast('Thanks! Give it a moment before sending another.', '#ffcd75'); return; }

// storm clouds: soft noise, made once (tiles left to right), drawn in two drifting layers
function mvMakeClouds(){
  const w = 256, h = 128, c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'), id = x.createImageData(w, h), d = id.data;
  const hash = (i, j, o) => { let k = Math.imul(i, 374761393) ^ Math.imul(j, 668265263) ^ Math.imul(o + 7, 1013904223); k = Math.imul(k ^ (k >>> 13), 1274126177); return ((k ^ (k >>> 16)) >>> 0)/4294967296; };

    let n = 0, amp = 0.55, tot = 0;
    for(let o = 0; o < 5; o++){
      const cx = 4 << o, cy = 2 << o, fx = px/w*cx, fy = py/h*cy, i = Math.floor(fx), j = Math.floor(fy), u = sm(fx - i), v = sm(fy - j);
      const a = hash(i % cx, j, o), b = hash((i + 1) % cx, j, o), e = hash(i % cx, j + 1, o), f = hash((i + 1) % cx, j + 1, o);

    }

  }

}
