  // ---- front (screen): glows, near clouds, lightning, smoke, embers
  const f = MV.fxx; f.setTransform(dpr, 0, 0, dpr, 0, 0); f.globalCompositeOperation = 'source-over'; f.globalAlpha = 1; f.clearRect(0, 0, W, H);
  if(MV.cracksOK && MV.logoOK && !dim){   // the cracks smoulder, and flare when lightning strikes or a button is reached for
    f.globalAlpha = Math.min(1, sa*(dim ? 0.35 : 1)*(0.5 + 0.18*Math.sin(t*1.4) + 0.08*Math.sin(t*3.7) + 0.35*MV.flare));
    f.drawImage(MV.cracks, LR.x, LR.y, LR.w, LR.h); f.globalAlpha = 1;
  }
  if(MV.imgOK){   // the eye's slow heartbeat
    const hb = Math.pow(Math.max(0, Math.sin(t*1.9)), 6) + 0.6*Math.pow(Math.max(0, Math.sin(t*1.9 - 0.55)), 10);
    const ex = X + MV_EYE[0]*R.w, ey = Y + MV_EYE[1]*R.h, er = R.w*0.07, ea = sa*(dim ? 0.3 : 1)*(0.18 + 0.4*hb + 0.2*MV.flare);
    const gr = f.createRadialGradient(ex, ey, 0, ex, ey, er); gr.addColorStop(0, `rgba(255,60,50,${ea})`); gr.addColorStop(0.35, `rgba(200,20,30,${ea*0.45})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    f.fillStyle = gr; f.fillRect(ex - er, ey - er, er*2, er*2);
  }
  mvClouds(f, W, H, t, sa*(0.16 + 0.12*fl), 0.5, 5, 0, R, Y); mvClouds(f, W, H, t, sa*(0.11 + 0.1*fl), 0.36, 10, -0.06, R, Y);   // dark clouds drifting over the sky above the title
  mvBolts(f, sa);
  mvFog(f, W, H, t, dt, sa);
  mvParticles(f, W, H, t, dt, sa);
  MV.flare *= Math.exp(-dt*1.8);
}

// a drifting cloud layer over the sky: alpha, band height (share of the picture), speed, where the band starts (share of the picture, from its top)
function mvClouds(c, W, H, t, alpha, band, speed, off, R, Y){
  if(!MV.clouds || alpha <= 0.004) return;
  const tw = Math.max(W, 800)*1.35, th = R.h*band, y = Math.max(-th*0.3, Y + R.h*off) + MV.par.y*0.4;
  let x = -((t*speed*tw/1000) % tw) + MV.par.x*0.6; if(x > 0) x -= tw;
  c.globalAlpha = Math.min(1, alpha);
  for(; x < W; x += tw) c.drawImage(MV.clouds, x, y, tw, th);
  c.globalAlpha = 1;
}

// blood from the cracks: a bead swells at the end of a crack, runs down the stone leaving a trail, and often lets a drop fall
function mvDrips(g, L, dt, sa){
  const X = L.x, Y = L.y, R = L, s = L.w/1400, u = Math.max(0.9, s*1.3);   // u: blood width on screen, never so fine it disappears on a phone
  if(!MV.em) MV.em = MV_DRIPS.map(e => ({x:e[0], y:e[1], w:e[2], wait:Math.random()*5/Math.sqrt(e[2]), busy:false}));
  for(const e of MV.em){
    if(e.busy) continue; e.wait -= dt;
    if(e.wait <= 0 && MV.drips.length < 14){ e.busy = true; e.wait = mvRand(4, 12)/Math.max(0.45, e.w);
      MV.drips.push({e, ph:0, t:0, swell:mvRand(1.1, 2.4), r:0, rMax:mvRand(1.8, 2.7), len:0, maxLen:mvRand(12, 40)*Math.min(1.6, 0.7 + e.w*0.25), v:mvRand(7, 13), hang:mvRand(0.3, 1.4), drop:Math.random() < 0.6, dy:0, vy:0, al:1, wob:Math.random()*6}); }
  }
  for(let i = MV.drips.length - 1; i >= 0; i--){
    const d = MV.drips[i]; d.t += dt;
    if(d.ph === 0){ d.r = d.rMax*Math.min(1, d.t/d.swell); if(d.t >= d.swell){ d.ph = 1; d.t = 0; } }                    // a bead swells
    else if(d.ph === 1){ d.len += d.v*dt*(1 - 0.75*d.len/d.maxLen); if(d.len >= d.maxLen*0.97){ d.ph = 2; d.t = 0; d.e.busy = false; } }   // it runs
    else if(d.ph === 2){ if(d.t >= d.hang){ d.ph = 3; d.t = 0; } }                                                            // it hangs
    else { if(d.drop && d.dy < 240){ d.vy += 420*dt; d.dy += d.vy*dt; } d.al -= dt/5; if(d.al <= 0){ MV.drips.splice(i, 1); continue; } }   // it falls, the trail dries
    const bx = X + d.e.x*R.w, by = Y + d.e.y*R.h, L = d.len*s, wob = Math.sin(d.wob)*0.6*u, al = sa*Math.max(0, d.al);
    g.globalAlpha = al; g.lineCap = 'round';
    if(L > 0.5){
      g.strokeStyle = '#43030a'; g.lineWidth = 1.5*u; g.beginPath(); g.moveTo(bx, by); g.quadraticCurveTo(bx + wob, by + L*0.5, bx + wob*0.4, by + L); g.stroke();
      g.strokeStyle = '#8e1220'; g.lineWidth = 0.7*u; g.beginPath(); g.moveTo(bx - 0.3*u, by + 0.5*u); g.quadraticCurveTo(bx + wob - 0.3*u, by + L*0.5, bx + wob*0.4 - 0.3*u, by + L); g.stroke();
    }
    const hangs = d.ph < 3 || !d.drop, br = Math.max(0.9*u, d.r*s*(hangs ? 1 : 0.55)), hx = bx + wob*0.4, hy = by + L + (hangs ? 0 : 0) + br*0.5;
    if(hangs || d.ph === 3){   // the bead at the end of the trail (smaller once its drop has fallen)
      g.fillStyle = '#4d040c'; g.beginPath(); g.ellipse(hx, hy, br, br*1.18, 0, 0, 7); g.fill();
      g.fillStyle = '#a3172a'; g.beginPath(); g.ellipse(hx - br*0.25, hy - br*0.2, br*0.55, br*0.6, 0, 0, 7); g.fill();
      g.fillStyle = 'rgba(255,140,140,.8)'; g.fillRect(hx - br*0.45, hy - br*0.5, Math.max(0.6, br*0.3), Math.max(0.6, br*0.3));
    }
    if(d.ph === 3 && d.drop && d.dy < 240){   // the falling drop, stretched by its speed
      const fr = Math.max(0.8*u, d.rMax*s*0.75), st = 1 + Math.min(2.2, d.vy/160), fy = by + L + d.dy*s + fr;
      g.globalAlpha = sa*Math.max(0, 1 - d.dy/240); g.fillStyle = '#5a0510'; g.beginPath(); g.ellipse(hx, fy, fr*0.8, fr*st, 0, 0, 7); g.fill();
      g.fillStyle = '#b01e30'; g.fillRect(hx - fr*0.35, fy - fr*st*0.4, Math.max(0.6, fr*0.35), Math.max(0.6, fr*0.6));
    }
  }
  g.globalAlpha = 1;
}

// lightning as in the trailer: a small, thin, far-off bolt in a top corner of the sky (alternating sides) inside a soft violet glow,
// flickering a few times, and distant thunder. It lights the clouds a little; the screen never flashes.
function mvLightning(dt, W, H, X, Y, R, a){
  MV.flash = Math.max(0, MV.flash - dt*2.5);
  for(const b of MV.bolts) b.life -= dt; if(MV.bolts.length) MV.bolts = MV.bolts.filter(b => b.life > 0);
  if(a < 0.65) return;
  MV.nextBolt -= dt; if(MV.nextBolt > 0) return;
  MV.nextBolt = mvRand(3.5, 7); MV.side = -MV.side;
  const vx0 = Math.max(X, 0), vx1 = Math.min(X + R.w, W), vy0 = Math.max(Y, 0), sc = Math.max(0.75, R.w/1280);
  const x0 = MV.side < 0 ? vx0 + (vx1 - vx0)*mvRand(0.04, 0.1) : vx1 - (vx1 - vx0)*mvRand(0.04, 0.1), y0 = vy0 + R.h*mvRand(0.02, 0.045);
  const b = mvBolt(x0, y0, R.h*mvRand(0.075, 0.11), MV.side < 0 ? 1 : -1, sc, 1.1);
  b.gx = x0; b.gy = y0 + R.h*0.05; b.gr = R.w*mvRand(0.055, 0.07); MV.bolts.push(b);
  MV.flash = 0.6; if(MV.mode === 'title') sfx('thunder');
}
function mvBolt(x, y, len, side, sc, jag = 1.1){   // a thin zigzag with now and then a short fork
  const pts = [[x, y]], n = Math.max(5, Math.round(len/(13*sc))), step = len/n, drift = side*mvRand(0.15, 0.45), forks = [];
  let cx = x, cy = y;
  for(let i = 1; i <= n; i++){
    cx += (Math.random() - 0.5)*step*jag + drift*step*0.5; cy += step*mvRand(0.75, 1.2); pts.push([cx, cy]);
    if(i > 1 && i < n - 1 && Math.random() < 0.22){ const fk = [[cx, cy]], dir = Math.random() < 0.5 ? -1 : 1; let fx = cx, fy = cy;
      for(let k = 0, m = Math.round(mvRand(1, 3)); k < m; k++){ fx += dir*mvRand(3, 8)*sc; fy += mvRand(4, 9)*sc; fk.push([fx, fy]); } forks.push(fk); }
  }
  return {pts, forks, life:0.5, max:0.5, w:sc};
}
function mvBolts(f, sa){
  if(!MV.bolts.length) return;
  f.save(); f.lineJoin = 'round'; f.lineCap = 'round';
  for(const b of MV.bolts){
    const ph = b.max - b.life, on = ph < 0.07 || (ph > 0.13 && ph < 0.24) || (ph > 0.33 && ph < 0.4), fade = Math.min(1, b.life/0.2);
    const al = sa*fade*(on ? 1 : 0.18);
    // the glow of the cloud it strikes in
    const gr = f.createRadialGradient(b.gx, b.gy, 0, b.gx, b.gy, b.gr); gr.addColorStop(0, `rgba(150,138,205,${0.34*al + 0.08*sa*fade})`); gr.addColorStop(0.55, `rgba(95,84,150,${0.14*al + 0.04*sa*fade})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    f.save(); f.translate(b.gx, b.gy); f.scale(1, 0.72); f.translate(-b.gx, -b.gy); f.fillStyle = gr; f.fillRect(b.gx - b.gr, b.gy - b.gr, b.gr*2, b.gr*2); f.restore();
    const path = pts => { f.beginPath(); f.moveTo(pts[0][0], pts[0][1]); for(let i = 1; i < pts.length; i++) f.lineTo(pts[i][0], pts[i][1]); f.stroke(); };
    f.shadowColor = `rgba(190,175,255,${al})`; f.shadowBlur = 5*b.w;
    f.strokeStyle = `rgba(215,205,255,${al*0.9})`; f.lineWidth = 1.25*b.w; path(b.pts);
    f.lineWidth = 0.8*b.w; f.strokeStyle = `rgba(200,190,250,${al*0.7})`; for(const fk of b.forks) path(fk);
  }
  f.restore();
}

// the red light of the pit far below, under the eye
function mvGlow(g, W, H, y, R, t, sa){
  const pulse = 0.82 + 0.18*Math.sin(t*1.25) + 0.06*Math.sin(t*3.1) + MV.flare*0.6;
  const px = W/2 + MV.par.x*0.5, py = H + Math.min(W, H)*0.06, pr = Math.max(W, H)*0.5;
  g.save(); g.globalCompositeOperation = 'lighter';
  const gr = g.createRadialGradient(px, py, 0, px, py, pr);
  gr.addColorStop(0, `rgba(160,18,30,${0.34*pulse*sa})`); gr.addColorStop(0.35, `rgba(90,10,22,${0.16*pulse*sa})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.restore();
}

// slow smoke drifting across everything (it crosses the title's edges, so the picture never reads as a box)
function mvFog(f, W, H, t, dt, sa){
  const M = Math.max(W, H);
  if(MV.fogs.length === 0) for(let i = 0; i < 5; i++) MV.fogs.push({x:Math.random(), y:mvRand(0.12, 0.95), r:mvRand(0.32, 0.58), v:mvRand(0.006, 0.016)*(Math.random() < 0.5 ? -1 : 1), a:mvRand(0.03, 0.05), ph:Math.random()*6});
  for(const o of MV.fogs){
    o.x += o.v*dt; const span = 1 + o.r*2*M/W; if(o.x > 1 + o.r*M/W) o.x -= span; if(o.x < -o.r*M/W) o.x += span;
    const cx = o.x*W, cy = o.y*H + Math.sin(t*0.13 + o.ph)*H*0.02, r = o.r*M, a = o.a*(0.75 + 0.25*Math.sin(t*0.3 + o.ph))*sa;
    const gr = f.createRadialGradient(cx, cy, 0, cx, cy, r);
    gr.addColorStop(0, `rgba(115,100,150,${a})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
    f.fillStyle = gr; f.fillRect(cx - r, cy - r, r*2, r*2);
  }
}

function mvBurst(n){
  const W = innerWidth, H = innerHeight;
  for(let i = 0; i < n && MV.embers.length < 140; i++) MV.embers.push({x:W/2 + (Math.random() + Math.random() - 1)*W*0.3, y:H + 4, vx:mvRand(-10, 10), vy:mvRand(-90, -40), life:0, max:mvRand(1.8, 3.6), s:mvRand(1, 2.2), ph:Math.random()*6.3});
}

// embers rising from the pit, and fine dust
function mvParticles(f, W, H, t, dt, sa){
  const rate = 8 + MV.flare*20;
  if(Math.random() < rate*dt && MV.embers.length < 140) mvBurst(1);
  for(let i = MV.embers.length - 1; i >= 0; i--){
    const e = MV.embers[i]; e.life += dt; if(e.life > e.max || e.y < -10){ MV.embers.splice(i, 1); continue; }
    e.x += (e.vx + Math.sin(t*2.2 + e.ph)*8)*dt; e.y += e.vy*dt; e.vy *= 1 - 0.12*dt;
    const k = e.life/e.max, al = (k < 0.1 ? k/0.1 : 1 - (k - 0.1)/0.9)*sa*(0.7 + 0.3*Math.sin(t*9 + e.ph));
    f.fillStyle = k < 0.3 ? `rgba(255,205,117,${al})` : k < 0.65 ? `rgba(255,112,64,${al})` : `rgba(228,59,68,${al})`;
    f.fillRect(e.x - e.s/2, e.y - e.s/2, e.s, e.s);
    f.fillStyle = `rgba(228,59,68,${al*0.18})`; f.fillRect(e.x - e.s*1.5, e.y - e.s*1.5, e.s*3, e.s*3);
  }
  if(MV.dust.length === 0) for(let i = 0; i < 28; i++) MV.dust.push({x:Math.random(), y:Math.random(), v:mvRand(0.004, 0.012), ph:Math.random()*6.3, s:mvRand(0.8, 1.6)});
  for(const d of MV.dust){
    d.y -= d.v*dt; if(d.y < -0.02){ d.y = 1.02; d.x = Math.random(); }
    const x = d.x*W + Math.sin(t*0.4 + d.ph)*12 + MV.par.x*0.8, y = d.y*H + MV.par.y*0.8, al = (0.12 + 0.12*Math.sin(t*1.7 + d.ph))*sa;
    f.fillStyle = `rgba(200,180,230,${al})`; f.fillRect(x, y, d.s, d.s);
  }
}

// ============ MAIN: input & loop ============
const KEYS = {};
const joy = {id:null, x:0, y:0, cx:0, cy:0};
addEventListener('keydown', e => {
  auInit();
  if(e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase(); KEYS[k] = true;
  if(CUT.on && G.state !== 'play'){ if(k === 'escape'){ e.preventDefault(); cutEnd(true); } else if(k === 'enter' || k === ' '){ e.preventDefault(); cutNext(); } return; }
  if(G.state !== 'play') return;
  const a = keyAct(k);
  if(k === 'escape'){ if(CUT.on) cutEnd(true); else if(UI.dialog) closeDialog(); else if(UI.panel) closePanel(); else openPanel('menu'); return; }
  if(UI.dialog){ if(a === 'interact' || k === ' ' || k === 'enter'){ if(CUT.on){ cutNext(); return; } const b = document.querySelector('#dlgopts .btn, .note .btn'); if(b) b.click(); } return; }
  const PANEL_OF = {inv:'inv', char:'char', skills:'skills', journal:'journal', map:'map', oils:'oils'};
  if(PANEL_OF[a]){ UI.panel === PANEL_OF[a] ? closePanel() : openPanel(PANEL_OF[a]); return; }
  if(a === 'overlay'){ e.preventDefault(); if(!e.repeat){ UI.mapOver = !UI.mapOver; saveSettings(); } return; }   // the map in the middle of the screen
  if(UI.panel) return;
  if(/^s[1-5]$/.test(a || '')){ useSlot(+a[1] - 1); return; }
  if(a === 'hp') drinkPotion('hp');
  if(a === 'mp') drinkPotion('mp');
  if(a === 'portal') castTownPortal();
  if(a === 'interact'){ e.preventDefault(); const o = nearestInteract(); if(o) interact(o); else pickupNearest(); }
  if(a === 'dodge'){ e.preventDefault(); if(!e.repeat) dodge(); }   // the dodge: roll, shadow dash or arcane slide
});
addEventListener('keyup', e => { KEYS[e.key.toLowerCase()] = false; });
// Settings > Controls: the next key pressed becomes the binding (before anything else sees it)
addEventListener('keydown', e => { if(!UI.rebind) return; e.preventDefault(); e.stopImmediatePropagation(); bindSet(e.key.toLowerCase()); }, true);
addEventListener('blur', () => { for(const k in KEYS) KEYS[k] = false; INPUT.attack = false; });
function keyMove(){
  let x = 0, y = 0;
  const on = a => BIND[a].some(k => k && KEYS[k]);
  if(on('left')) x -= 1; if(on('right')) x += 1;
  if(on('up')) y -= 1; if(on('down')) y += 1;
  return [x, y];
}
// pointer on canvas
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  auInit();
  if(G.state !== 'play' || uiBlocking()) return;
  if(e.pointerType === 'mouse'){
    INPUT.mouseAim = true; INPUT.mouseScreen = {x:e.clientX, y:e.clientY};
    if(e.button === 2){ useSlot(0); return; }
    { const P = G.P, X = e.clientX*DPR, Y = e.clientY*DPR;   // a click on a piece of gear's name, within reach, picks it up
      const l = G.loot.findLast(l => l.lab && l.map === G.M && X >= l.lab[0] && X <= l.lab[0] + l.lab[2] && Y >= l.lab[1] && Y <= l.lab[1] + l.lab[3] && Math.hypot(l.x - P.x, l.y - P.y) < 40);   // the name drawn on top
      if(l){ takeLoot(l); return; } }
    const o = G.nearObj; if(o && G.M.isTown && o.type !== 'loot'){ interact(o); return; }
    if(o && o.type !== 'chest'){ const w = screenToWorld(e.clientX, e.clientY); if(Math.hypot(w.x - o.x, w.y - o.y) < 22){ interact(o); return; } }
    INPUT.attack = true;
  } else {
    if(joy.id === null && e.clientX < innerWidth*0.6){ joy.id = e.pointerId; joy.cx = e.clientX; joy.cy = e.clientY; joy.x = joy.y = 0; const j = $('joy'); j.classList.remove('hide'); j.style.left = e.clientX + 'px'; j.style.top = e.clientY + 'px'; j.firstElementChild.style.transform = ''; $('joyhint').classList.add('hide'); }
    else if(e.clientX >= innerWidth*0.6){ const o = G.nearObj; if(o) interact(o); }
  }
});
addEventListener('pointermove', e => {
  if(e.pointerType === 'mouse'){ INPUT.mouseScreen = {x:e.clientX, y:e.clientY}; if(G.state === 'play') INPUT.mouseAim = true; }
  if(e.pointerId === joy.id){
    let dx = e.clientX - joy.cx, dy = e.clientY - joy.cy; const d = Math.hypot(dx, dy), max = 50*(GFX.uis || 1);
    if(d > max){ dx = dx/d*max; dy = dy/d*max; }
    joy.x = dx/max; joy.y = dy/max; $('joy').firstElementChild.style.transform = `translate(${dx}px,${dy}px)`;
  }
});
const endPtr = e => { if(e.pointerId === joy.id){ joy.id = null; joy.x = joy.y = 0; $('joy').classList.add('hide'); } if(e.pointerType === 'mouse') INPUT.attack = false; };
addEventListener('pointerup', endPtr); addEventListener('pointercancel', endPtr);
const atkBtn = $('atk');
atkBtn.addEventListener('pointerdown', e => { e.stopPropagation(); e.preventDefault(); auInit(); if(G.M && G.M.isTown){ toast('You cannot fight in Palli.', '#94b0c2', 1.4); return; } INPUT.attack = true; INPUT.mouseAim = false; try{ atkBtn.setPointerCapture && atkBtn.setPointerCapture(e.pointerId); }catch(err){} });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => atkBtn.addEventListener(ev, () => { INPUT.attack = false; }));
document.addEventListener('pointerdown', () => auInit(), {once:false});
function screenToWorld(sx, sy){ const c = G.camR || G.cam; return {x:c.x + sx*DPR/zoom, y:c.y + sy*DPR/zoom}; }

// ---------- loop ----------
let lastT = performance.now();
function loop(now){
  if(now - lastT < GFX.minFrame){ requestAnimationFrame(loop); return; }   // frame cap (see resize)
  const ms0 = now - lastT, dt = Math.min(0.05, ms0/1000); lastT = now;
  try{
    menuFrame(now, dt);
    sndTick();
    if(G.M && G.P){
      unfocusIfFree();
      if(!isTouch || joy.id === null){ const [kx, ky] = keyMove(); if(joy.id === null){ INPUT.mx = kx; INPUT.my = ky; } }
      if(joy.id !== null){ INPUT.mx = joy.x; INPUT.my = joy.y; }
      if(INPUT.mouseScreen) INPUT.mouseWorld = screenToWorld(INPUT.mouseScreen.x, INPUT.mouseScreen.y);
      padFrame(dt);
      if((G.state === 'play' || G.state === 'dead') && !UI.panel && !UI.dialog) update(dt);
      else if(!UI.dialog) for(const h of party()) if(h.lying > 0) h.lying -= dt;
      if(G.state !== 'menu'){ if(!UI.panel || now - (G.drawnAt || 0) > 100){ G.drawnAt = now; render(); } updateHUD(dt); p2HUD(); shadeWatch(ms0); }   // behind an open panel the game stands still: 10 pictures a second are plenty
    } else padFrame(dt);
  }catch(err){ console.error(err); if(!window.__errShown){ window.__errShown = true; toast('Error: ' + err.message, '#e43b44', 8); } }
  requestAnimationFrame(loop);
}
loadSettings(); setVolumes(AU.musicVol, AU.sfxVol);
initHUD();
bootIntro();   // the trailer, then the title screen
requestAnimationFrame(loop);
window.__md = {G, startNew, goDungeon, goTown, makeItem, makeMonster, gainXP, openPanel, closePanel, talkTo, useSkill, useSlot, setSlot, interact, derive};
