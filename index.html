<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malformed Depths: down for maintenance</title>
<meta name="description" content="Malformed Depths is down for maintenance while Palli is rebuilt. The free demo will be back soon.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07050b">
<style>
@font-face{font-family:Pirata;src:url(assets/fonts/pirata-one-latin-400-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:VT;src:url(assets/fonts/vt323-latin-400-normal.woff2) format('woff2');font-display:swap}
:root{--bg:#07050b;--ink:#e8dccb;--dim:#9a8fa6;--gold:#ffd890}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);height:100%}
body{color:var(--ink);font:20px/1.45 VT,ui-monospace,monospace}
.hero{position:relative;min-height:100svh;display:grid;place-items:center;text-align:center;padding:48px 20px;isolation:isolate;overflow:hidden}
.hero::before{content:"";position:absolute;inset:-4%;background:url(assets/menu_bg3.webp) center/cover;z-index:-2;filter:brightness(.4) saturate(.85);animation:drift 40s ease-in-out infinite alternate}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 45%,transparent 30%,rgba(7,5,11,.78) 75%,var(--bg) 100%)}
@keyframes drift{from{transform:scale(1.04) translateY(-1%)}to{transform:scale(1.1) translateY(1.5%)}}
@media (prefers-reduced-motion:reduce){.hero::before{animation:none}}
.logo{width:min(640px,90vw);height:auto;filter:drop-shadow(0 6px 24px rgba(0,0,0,.8))}
h1{font:400 clamp(34px,5.5vw,52px)/1.1 Pirata,serif;color:var(--gold);margin:18px 0 10px;letter-spacing:.02em}
p{max-width:40ch;margin:0 auto;color:var(--ink);font-size:clamp(20px,2.6vw,24px)}
.dim{color:var(--dim);margin-top:14px;font-size:18px}
</style>
</head>
<body>
<main class="hero">
  <div>
    <img class="logo" src="assets/menu_logo.webp" alt="Malformed Depths">
    <h1>Down for maintenance</h1>
    <p>Palli is being rebuilt. The free demo will be back soon.</p>
    <p class="dim">Wellz Digitalez</p>
  </div>
</main>
</body>
</html>
